# I448 (lineage_head_invariants.rs): every backend's supersede executor asks the shared
# held-head verdict (which runs the prev check) on both arms (v61, #934 S4b).
id: i448-prev-head-check
language: rust
severity: hint
message: "held_head_verdict call site"
rule:
  kind: call_expression
  has:
    field: function
    regex: '(^|::|\.)held_head_verdict$'
  inside:
    kind: function_item
    stopBy: end
    has:
      field: name
      regex: '^(store_planned_supersede)$'
files:
  - src/store/sqlite.rs
  - src/store/postgres.rs
