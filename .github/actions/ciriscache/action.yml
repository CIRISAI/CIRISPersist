name: "CIRISCache layered restore"
description: >
  Compute the canonical CIRISCache key (CIRISServer#99) and do the layered,
  widest→narrowest restore so every compile job inherits the warmed substrate
  cache from one source (CIRISPersist#311). persist depends only on
  ciris-verify (the start of the centipede), so it's a 2-layer restore: verify's
  leaf blob first (its crypto/keyring registry deps), then persist's own blob
  last (wins on overlap). Sets `CIRISCACHE_KEY` in the job env so a later
  `save@v1` (where present) reuses it.

inputs:
  plat:
    description: >
      The canonical <PLAT> token, byte-identical to what verify/server save under
      (linux-x86_64, linux-aarch64, macos-aarch64, macos-x86_64, windows-x64,
      android-<abi>, ios-<target-triple>). The caller resolves it (literal for
      host jobs; matrix interpolation for android/ios; a label case for the wheel).
    required: true

runs:
  using: composite
  steps:
    # Source p/v from Cargo.toml (committed): persist GITIGNORES Cargo.lock, so
    # it does not exist at compute time — grepping it yielded `-pnone-vnone`,
    # which never matched downstream's version-carrying keys (CIRISPersist#311
    # key-fix). P = the package version; V = the verify pin tag; e=none.
    - name: Compute CIRISCache keys (canonical, CIRISServer#99)
      shell: bash
      run: |
        RUSTC=$(rustc -V | awk '{print $2}')
        P=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
        V=$(grep -m1 'tag = "v' Cargo.toml | sed -E 's/.*tag = "v([0-9.]+)".*/\1/')
        BASE="ciris-substrate-v1-${{ inputs.plat }}-release-rustc${RUSTC}"
        echo "CIRISCACHE_KEY=${BASE}-p${P:-none}-enone-v${V:-none}" >> "$GITHUB_ENV"
        # CIRISPersist#320-followup — a ROLLING "most-recent persist build" key.
        # The versioned key above misses on every version bump (p11.6.0 →
        # p11.6.1 never existed), so before this only the verify layer restored
        # and persist's OWN deps (pyo3/rusqlite/tokio-postgres/candle…) — which
        # the verify blob does NOT hold — recompiled from scratch every release.
        # `phead` is persist-version-INDEPENDENT (overwritten each build), so a
        # PERSIST version bump restores the last persist `target/` (verify + all
        # persist deps + persist crate) and cargo recompiles only CHANGED files.
        # BUT the key still embeds the VERIFY version, so a VERIFY bump rotates
        # it → miss → every leg cold-compiles persist's heavy deps (pyo3 /
        # rusqlite / tokio / candle / ort / tokenizers…). `HEAD_ANYV` is the
        # verify-AGNOSTIC fallback: restore@v2 treats a trailing `*` as a prefix
        # and restores the most-recent (version-sorted) match, so on a verify
        # bump it pulls the last phead of ANY verify version — cargo then
        # recompiles only the changed verify crates + persist, reusing the heavy
        # verify-INDEPENDENT deps. Incremental, not cold (follow-up to #458; the
        # 10s "restore" on a verify-bump leg was this exact miss). The versioned
        # blob still exists for edge's cross-repo exact-pin.
        echo "CIRISCACHE_KEY_HEAD=${BASE}-phead-enone-v${V:-none}" >> "$GITHUB_ENV"
        echo "CIRISCACHE_KEY_HEAD_ANYV=${BASE}-phead-enone-v*" >> "$GITHUB_ENV"
        echo "CIRISCACHE_KEY_VERIFY=${BASE}-pnone-enone-v${V:-none}" >> "$GITHUB_ENV"
        echo "CIRISCache: persist =${BASE}-p${P:-none}-enone-v${V:-none}"
        echo "CIRISCache: head    =${BASE}-phead-enone-v${V:-none}"
        echo "CIRISCache: head*   =${BASE}-phead-enone-v* (verify-agnostic fallback)"
        echo "CIRISCache: verify  =${BASE}-pnone-enone-v${V:-none}"
    # Single first-hit-wins restore (restore@v2). CIRISPersist#458-followup: the
    # old 3-step layered restore extracted the phead blob AND the versioned blob
    # (byte-IDENTICAL 3.7 GB supersets) back-to-back — ~200-240s of redundant
    # extraction on EVERY leg (measured on the v17.5.0-era main run). Each blob
    # is a complete superset of the shallower layers (save uploads the full
    # `~/.cargo/registry + target`), so the DEEPEST hit alone suffices — no
    # cumulative overlay. Order = most-specific → widest; restore@v2 restores the
    # first key that hits and SKIPS the rest (one extraction, not four):
    #   1. this exact version    (same-version re-run)
    #   2. rolling phead         (persist-version bump, SAME verify — common case)
    #   3. phead any-verify (*)  (VERIFY bump — restore last phead of any verify
    #                             version → recompile only verify + persist,
    #                             reuse the heavy verify-independent deps)
    #   4. verify upstream leaf  (first-ever build; nothing persist cached yet)
    - uses: CIRISAI/CIRISCache/restore@v2
      continue-on-error: true
      with:
        keys: |
          ${{ env.CIRISCACHE_KEY }}
          ${{ env.CIRISCACHE_KEY_HEAD }}
          ${{ env.CIRISCACHE_KEY_HEAD_ANYV }}
          ${{ env.CIRISCACHE_KEY_VERIFY }}
