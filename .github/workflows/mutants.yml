name: mutants and powerset

on:
  schedule:
    - cron: '17 6 * * *'      # nightly: the consent gate and the counters
    - cron: '43 6 * * 0'      # Sunday: also scope-observe-sites and the powerset
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  # No RUSTFLAGS: -D warnings here would make most mutants unviable.

jobs:
  # Every leg is a gate (CIRISPersist#1051): a run that hits its budget or
  # leaves survivors must not read green. scripts/mutants.sh refuses a scope that
  # does not fit its budget before building (exit 3), fails an INCOMPLETE run
  # (4) and any surviving mutant not in scripts/mutants/allowed_survivors.txt
  # (5), and writes the verdict to the step summary with annotations.
  #
  # Sizing: 600 s + 120 s per mutant (measured: baseline 305 s, p90 105 s per
  # mutant). scope-observe's 71 mutants need 9120 s, so it runs
  # as two shards; scope-consent-gate's 19 need 2880 s.
  mutants:
    name: mutants (${{ matrix.scope }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scope: scope-consent-gate, shard: '', id: consent-gate, weekly: false}
          - {scope: scope-observe, shard: '0/2', id: observe-0-of-2, weekly: false}
          - {scope: scope-observe, shard: '1/2', id: observe-1-of-2, weekly: false}
          - {scope: scope-observe-sites, shard: '', id: observe-sites, weekly: true}
          # The s0 scopes are 19 mutants each. s1's 215 take about 8 h, so
          # they run as 5 shards on the weekly run.
          - {scope: scope-s0-hard-case, shard: '', id: s0-hard-case, weekly: false}
          - {scope: scope-s0-roster-seam, shard: '', id: s0-roster-seam, weekly: false}
          - {scope: scope-s1-cirisnode, shard: '0/5', id: s1-cirisnode-0-of-5, weekly: true}
          - {scope: scope-s1-cirisnode, shard: '1/5', id: s1-cirisnode-1-of-5, weekly: true}
          - {scope: scope-s1-cirisnode, shard: '2/5', id: s1-cirisnode-2-of-5, weekly: true}
          - {scope: scope-s1-cirisnode, shard: '3/5', id: s1-cirisnode-3-of-5, weekly: true}
          - {scope: scope-s1-cirisnode, shard: '4/5', id: s1-cirisnode-4-of-5, weekly: true}
          - {scope: scope-s2-goals, shard: '0/3', id: s2-goals-0-of-3, weekly: true}
          - {scope: scope-s2-goals, shard: '1/3', id: s2-goals-1-of-3, weekly: true}
          - {scope: scope-s2-goals, shard: '2/3', id: s2-goals-2-of-3, weekly: true}
          # The key plane (CIRISPersist#934 step 3): 129 mutants, three shards
          # (600 s + 120 s x 43 = 5760 s each), weekly.
          - {scope: scope-s3-key-plane, shard: '0/3', id: s3-key-plane-0-of-3, weekly: true}
          - {scope: scope-s3-key-plane, shard: '1/3', id: s3-key-plane-1-of-3, weekly: true}
          - {scope: scope-s3-key-plane, shard: '2/3', id: s3-key-plane-2-of-3, weekly: true}
          # The CC rc9 vendor (the policy table read at
          # runtime, the corridor at admission, the registry loader) and
          # #1114's three refusals. 108 mutants, three shards
          # (600 s + 120 s x 36 = 4920 s each), weekly.
          - {scope: scope-s6v-vendor, shard: '0/3', id: s6v-vendor-0-of-3, weekly: true}
          - {scope: scope-s6v-vendor, shard: '1/3', id: s6v-vendor-1-of-3, weekly: true}
          - {scope: scope-s6v-vendor, shard: '2/3', id: s6v-vendor-2-of-3, weekly: true}
          # The consent sweep (CIRISPersist#934 step 4, #1105): 302 mutants, six
          # shards (600 s + 120 s x 51 = 6720 s each), weekly.
          - {scope: scope-s4-consent-sweep, shard: '0/6', id: s4-consent-sweep-0-of-6, weekly: true}
          - {scope: scope-s4-consent-sweep, shard: '1/6', id: s4-consent-sweep-1-of-6, weekly: true}
          - {scope: scope-s4-consent-sweep, shard: '2/6', id: s4-consent-sweep-2-of-6, weekly: true}
          - {scope: scope-s4-consent-sweep, shard: '3/6', id: s4-consent-sweep-3-of-6, weekly: true}
          - {scope: scope-s4-consent-sweep, shard: '4/6', id: s4-consent-sweep-4-of-6, weekly: true}
          - {scope: scope-s4-consent-sweep, shard: '5/6', id: s4-consent-sweep-5-of-6, weekly: true}
          # The sites added when the memory backend was retired
          # (CIRISPersist#1002): the #720 lifecycle predicate, the #691 tree binding, the
          # moved fountain assembler, the test constructor) and the genesis
          # scratch on both backends with its reaper. 44 mutants, one shard
          # (600 s + 120 s x 44 = 5880 s), nightly.
          - {scope: scope-s5-memory-retire, shard: '', id: s5-memory-retire, weekly: false}
          # Affiliations (CIRISPersist#1036, #1049, #1062, #1048): 212 mutants,
          # eight shards of <= 27, weekly. This scope measures ~168 s per
          # mutant on CI, so shards of 43 do not fit; 600 s + 168 s x 27 =
          # 5136 s fits 7200 s.
          - {scope: scope-s6-affiliations, shard: '0/8', id: s6-affiliations-0-of-8, weekly: true}
          - {scope: scope-s6-affiliations, shard: '1/8', id: s6-affiliations-1-of-8, weekly: true}
          - {scope: scope-s6-affiliations, shard: '2/8', id: s6-affiliations-2-of-8, weekly: true}
          - {scope: scope-s6-affiliations, shard: '3/8', id: s6-affiliations-3-of-8, weekly: true}
          - {scope: scope-s6-affiliations, shard: '4/8', id: s6-affiliations-4-of-8, weekly: true}
          - {scope: scope-s6-affiliations, shard: '5/8', id: s6-affiliations-5-of-8, weekly: true}
          - {scope: scope-s6-affiliations, shard: '6/8', id: s6-affiliations-6-of-8, weekly: true}
          - {scope: scope-s6-affiliations, shard: '7/8', id: s6-affiliations-7-of-8, weekly: true}
          # Fixes (CIRISPersist#1072, #1069, #1070, #1006, #1132):
          # 97 mutants, four shards of <= 25 at the measured 168 s
          # per mutant (600 s + 168 s x 25 = 4800 s), weekly. Three shards
          # would hold 33.
          - {scope: scope-601-fixes, shard: '0/4', id: 601-fixes-0-of-4, weekly: true}
          - {scope: scope-601-fixes, shard: '1/4', id: 601-fixes-1-of-4, weekly: true}
          - {scope: scope-601-fixes, shard: '2/4', id: 601-fixes-2-of-4, weekly: true}
          - {scope: scope-601-fixes, shard: '3/4', id: 601-fixes-3-of-4, weekly: true}
          # The consumer asks (CIRISPersist#1117, #1064, #1120, #1113).
          # 110 mutants, four shards of <= 28
          # (600 s + 168 s x 28 = 5304 s each at the CI rate), weekly.
          - {scope: scope-601-asks, shard: '0/4', id: 601-asks-0-of-4, weekly: true}
          - {scope: scope-601-asks, shard: '1/4', id: 601-asks-1-of-4, weekly: true}
          - {scope: scope-601-asks, shard: '2/4', id: 601-asks-2-of-4, weekly: true}
          - {scope: scope-601-asks, shard: '3/4', id: 601-asks-3-of-4, weekly: true}
          # The principal fold (v59.1.1): `principals_of`'s owner-revocation
          # clause, `may_receive_group_plane` reading it, and `epoch_minter::resolve`
          # narrowing several granting minters to the author's sealer.
          # 14 mutants, one shard (600 s + 168 s x 14 = 2952 s), nightly.
          - {scope: scope-5911-principals, shard: '', id: 5911-principals, weekly: false}
          # The Postgres pool (v59.1.2): `pool_config`'s size floor and
          # `checkout`'s typed starvation. 2 mutants, one shard, nightly.
          - {scope: scope-5912-pool, shard: '', id: 5912-pool, weekly: false}
          # The group plane (CIRISPersist#991 planes 2 and 3): 162 mutants, six
          # shards of <= 27 at the measured 168 s per mutant
          # (600 s + 168 s x 27 = 5136 s each), weekly.
          - {scope: scope-s1-group-plane, shard: '0/6', id: s1-group-plane-0-of-6, weekly: true}
          - {scope: scope-s1-group-plane, shard: '1/6', id: s1-group-plane-1-of-6, weekly: true}
          - {scope: scope-s1-group-plane, shard: '2/6', id: s1-group-plane-2-of-6, weekly: true}
          - {scope: scope-s1-group-plane, shard: '3/6', id: s1-group-plane-3-of-6, weekly: true}
          - {scope: scope-s1-group-plane, shard: '4/6', id: s1-group-plane-4-of-6, weekly: true}
          - {scope: scope-s1-group-plane, shard: '5/6', id: s1-group-plane-5-of-6, weekly: true}
          # The S1 retirements (KeyGrant, the member listing, the group
          # record's withdraws): 10 mutants, one shard
          # (600 s + 168 s x 10 = 2280 s), nightly.
          - {scope: scope-s1-retire, shard: '', id: s1-retire, weekly: false}
          # v61 S4a (CIRISPersist#934, #1166): the shared plans the identical
          # doors moved onto, the bounded checkout. 161 mutants, nine shards
          # of <= 18; the witness filter is the doors' own suites on both
          # backends (~330 s per mutant, ESTIMATED from the local filter run),
          # so 600 s + 330 s x 18 = 6540 s each, weekly.
          - {scope: scope-s4a-plans, shard: '0/9', id: s4a-plans-0-of-9, weekly: true}
          - {scope: scope-s4a-plans, shard: '1/9', id: s4a-plans-1-of-9, weekly: true}
          - {scope: scope-s4a-plans, shard: '2/9', id: s4a-plans-2-of-9, weekly: true}
          - {scope: scope-s4a-plans, shard: '3/9', id: s4a-plans-3-of-9, weekly: true}
          - {scope: scope-s4a-plans, shard: '4/9', id: s4a-plans-4-of-9, weekly: true}
          - {scope: scope-s4a-plans, shard: '5/9', id: s4a-plans-5-of-9, weekly: true}
          - {scope: scope-s4a-plans, shard: '6/9', id: s4a-plans-6-of-9, weekly: true}
          - {scope: scope-s4a-plans, shard: '7/9', id: s4a-plans-7-of-9, weekly: true}
          - {scope: scope-s4a-plans, shard: '8/9', id: s4a-plans-8-of-9, weekly: true}
          # v61 S4b (CIRISPersist#934): the last identical doors' shared plans
          # (transport, occurrence, family, supersede). ~90 mutants (ESTIMATED:
          # 30 fns at ~3 each), five shards of <= 18; the witness filter is the
          # doors' own suites on both backends (~330 s per mutant, ESTIMATED
          # as S4a's), so 600 s + 330 s x 18 = 6540 s each, weekly.
          - {scope: scope-s4b-plans, shard: '0/5', id: s4b-plans-0-of-5, weekly: true}
          - {scope: scope-s4b-plans, shard: '1/5', id: s4b-plans-1-of-5, weekly: true}
          - {scope: scope-s4b-plans, shard: '2/5', id: s4b-plans-2-of-5, weekly: true}
          - {scope: scope-s4b-plans, shard: '3/5', id: s4b-plans-3-of-5, weekly: true}
          - {scope: scope-s4b-plans, shard: '4/5', id: s4b-plans-4-of-5, weekly: true}
          # The S3 record-shape breaks (CC 2.6.2 strict instants, #1126, #1101,
          # #1122, #1146, #1156): 147 mutants, six shards of <= 25
          # (600 s + 168 s x 25 = 4800 s each), weekly.
          - {scope: scope-s3-shapes, shard: '0/6', id: s3-shapes-0-of-6, weekly: true}
          - {scope: scope-s3-shapes, shard: '1/6', id: s3-shapes-1-of-6, weekly: true}
          - {scope: scope-s3-shapes, shard: '2/6', id: s3-shapes-2-of-6, weekly: true}
          - {scope: scope-s3-shapes, shard: '3/6', id: s3-shapes-3-of-6, weekly: true}
          - {scope: scope-s3-shapes, shard: '4/6', id: s3-shapes-4-of-6, weekly: true}
          - {scope: scope-s3-shapes, shard: '5/6', id: s3-shapes-5-of-6, weekly: true}
          # v61 S2 — rooms on the new rows and the field blockers (#1123,
          # #1063, #1100 2(i), #1157/#1155, #1148, #1165, #1140, #1143):
          # 154 mutants, six shards of <= 26 at the measured 168 s per mutant
          # (600 s + 168 s x 26 = 4968 s each), weekly.
          - {scope: scope-s2-rooms, shard: '0/6', id: s2-rooms-0-of-6, weekly: true}
          - {scope: scope-s2-rooms, shard: '1/6', id: s2-rooms-1-of-6, weekly: true}
          - {scope: scope-s2-rooms, shard: '2/6', id: s2-rooms-2-of-6, weekly: true}
          - {scope: scope-s2-rooms, shard: '3/6', id: s2-rooms-3-of-6, weekly: true}
          - {scope: scope-s2-rooms, shard: '4/6', id: s2-rooms-4-of-6, weekly: true}
          - {scope: scope-s2-rooms, shard: '5/6', id: s2-rooms-5-of-6, weekly: true}
    services:
      postgres:
        image: ghcr.io/cirisai/postgres:16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: ciris
          POSTGRES_PASSWORD: ciris
          POSTGRES_DB: ciris_persist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: skip the weekly scopes except on the weekly run
        id: gate
        env:
          WEEKLY: ${{ matrix.weekly }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$WEEKLY" = true ] && [ "$SCHEDULE" = '17 6 * * *' ]; then
            echo run=false >> "$GITHUB_OUTPUT"; else echo run=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v6
        if: steps.gate.outputs.run == 'true'
      - uses: dtolnay/rust-toolchain@1.97.0
        if: steps.gate.outputs.run == 'true'
      - uses: ./.github/actions/ciriscache
        if: steps.gate.outputs.run == 'true'
        with:
          plat: linux-x86_64
      - uses: taiki-e/install-action@v2
        if: steps.gate.outputs.run == 'true'
        with:
          tool: cargo-nextest,cargo-mutants@27.1.0
      - name: psql client for pg_test_db.sh
        if: steps.gate.outputs.run == 'true'
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      # The matrix scripts' own witnesses (fixture outputs, no cargo), before
      # two hours of mutants are read by them (CIRISPersist#1045 item 4).
      - name: mutants_matrix self-test
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/mutants_matrix_test.py
      # The scope this job is about to run resolves and names tests.
      - name: mutation scopes are well-formed (from disk)
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/mutants_scopes_check.py --self-test && python3 scripts/mutants_scopes_check.py
      - name: mutation matrix and verdict
        if: steps.gate.outputs.run == 'true'
        env:
          CIRIS_PERSIST_PG_ADMIN_URL: postgres://ciris:ciris@localhost:5432/ciris_persist_test
          MUTANTS_BUDGET_SECS: '7200'
          MUTANTS_JOBS: '1'
          MUTANTS_SHARD: ${{ matrix.shard }}
          SCOPE: scripts/mutants/${{ matrix.scope }}.txt
        run: scripts/mutants.sh cargo-mutants "$SCOPE"
      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: mutants-${{ matrix.id }}
          path: target/certify-logs/mutants/
          retention-days: 30

  powerset:
    name: powerset ${{ matrix.part }}/8
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 6 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Blocking. Every feature implies its prerequisites, so sets such as `tls`
    # without `postgres` or `pyo3-sqlite` without `pyo3` compile
    # (CIRISPersist#1030).
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: ./.github/actions/ciriscache
        with:
          plat: linux-x86_64
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: delta (no compile)
        run: python3 scripts/powerset_delta.py
      - name: cargo check, partition ${{ matrix.part }} of 8
        run: scripts/powerset.sh check ${{ matrix.part }}/8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: powerset-${{ matrix.part }}
          path: target/certify-logs/powerset/
          retention-days: 30
