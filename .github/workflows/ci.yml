name: CI

on:
  push:
    branches: [main]
    # v0.1.12 — also fire on v-prefixed release tags. Without this,
    # tag pushes don't trigger CI at all and the publish-pypi job
    # (gated on `refs/tags/v*`) never runs even when the tag exists.
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Mission category §4 (PLATFORM_ARCHITECTURE.md §4):
  # the linux-x86_64 path that runs the full feature set with a
  # real Postgres backing the integration tests.
  linux-x86_64-test:
    # v2.0.1 (CIRISPersist#95-track) — substrate-axis matrix. The 2.0
    # feature-gap fix turned every substrate on (audit/secrets/nodecore/
    # graph/telemetry) and the single test job ballooned to ~12 min.
    # Each substrate's `cfg` gates are independent, so splitting the
    # one widened invocation into a parallel matrix — one entry per
    # substrate — drops the test job's wall-clock to whichever entry
    # is slowest (~3-5 min) instead of the sum. The "core" entry
    # additionally runs the fixture suite + the pytest catch_panic
    # regression (kept on a single entry to avoid duplicating the
    # ~5-min release maturin-develop build). The wheel job already
    # exercises the full-features compile so a "all-substrates"
    # backstop entry isn't necessary here.
    name: linux-x86_64 (${{ matrix.substrate.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        substrate:
          - { name: core,       features: "postgres server pyo3 sqlite" }
          - { name: cirisaudit, features: "postgres server pyo3 sqlite cirisaudit" }
          - { name: secrets,    features: "postgres server pyo3 sqlite secrets" }
          - { name: cirisnode,  features: "postgres server pyo3 sqlite cirisnode" }
          - { name: cirisgraph, features: "postgres server pyo3 sqlite cirisgraph" }
          - { name: telemetry,  features: "postgres server pyo3 sqlite telemetry" }
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: ciris
          POSTGRES_PASSWORD: ciris
          POSTGRES_DB: ciris_persist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # v1.10.0 (CIRISPersist#87) — ciris-keyring's `tpm` feature
      # (auto-enabled for Linux targets, see Cargo.toml) builds
      # `tss-esapi`, which links libtss2 at build time.
      - name: install libtss2-dev (TPM build dep)
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      - uses: dtolnay/rust-toolchain@stable
      # v1.1.2 (CIRISVerify v2.1.1 hardening pattern):
      # `continue-on-error: true` on cache restore. A cache miss /
      # corruption shouldn't fail the whole job — compile from scratch
      # is slower but correct. Same on every Swatinem/rust-cache site
      # in this workflow.
      - uses: Swatinem/rust-cache@v2
        with:
          # v2.0.1 — per-substrate cache key so matrix entries don't
          # thrash each other's caches (each compiles a different
          # feature set).
          key: ${{ matrix.substrate.name }}
        continue-on-error: true
      # v2.0.1 — nextest, not cargo test: streams per-test PASS/FAIL/
      # SLOW lines so a hung test surfaces in the live log as "the
      # last RUN with no follow-up" instead of disappearing into a
      # buffered cargo-test silence. `.config/nextest.toml` carries
      # `slow-timeout` + `terminate-after` so a hung test is killed
      # at a bounded time with its name in the log — pre-2.0.1 the
      # whole CI sat for >1h before I cancelled by hand.
      - name: install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest (postgres + server + pyo3 + ${{ matrix.substrate.name }})
        # v2.0.1 — workflow-level kill switch independent of nextest:
        # if nextest itself stalls (or the runner does), GA aborts at
        # 25 min instead of waiting an hour.
        timeout-minutes: 25
        env:
          CIRIS_PERSIST_TEST_PG_URL: postgres://ciris:ciris@localhost:5432/ciris_persist_test
        # --test-threads=1 — nextest spawns each test in its own
        # PROCESS. The substrate PG tests share schema state in
        # cirislens_secrets/cirislens.federation_*/cirislens.audit_log
        # and use process-local caches (SOFTWARE_KEYS); two concurrent
        # processes racing TRUNCATEs leave caches+rows mismatched.
        # `#[serial_test::serial(postgres)]` only serializes within a
        # process. The CI gap-closure (every substrate now actually
        # tested in CI) made this visible across cirisaudit + secrets
        # + cirisnode entries. Per-test PG advisory locks fix it
        # cleanly for individual tests, but extending them everywhere
        # is a death-by-1000-cuts; --test-threads=1 kills the entire
        # class in one line at the cost of slightly higher per-entry
        # wall time (still bounded by `timeout-minutes: 25` below,
        # and the matrix axis still parallelizes across substrates).
        run: >-
          cargo nextest run --all-targets --no-fail-fast
          --test-threads=1 --features
          "${{ matrix.substrate.features }}"
      - name: cargo nextest (default — fixture suite)
        if: matrix.substrate.name == 'core'
        timeout-minutes: 5
        run: cargo nextest run --test wire_format_fixtures
      # v0.5.4 (CIRISPersist#29) — Python regression test for the FFI
      # catch_panic layer. Builds the wheel with the `test-panic`
      # feature gate enabled (release wheels don't), then pytest
      # confirms a Rust panic crossing the FFI surfaces as
      # `LensQueryError` (Exception) and NOT `PanicException`
      # (BaseException) — the v0.5.3+v0.5.4 invariant. Closes the
      # CIRISPersist#24 failure class regression-test gap.
      # v2.0.1 — pytest catch_panic regression runs on the "core"
      # matrix entry only. The `--release maturin develop` step is
      # ~5 min by itself; duplicating it per substrate matrix entry
      # would defeat the matrix parallelization. The substrate
      # feature axis doesn't change what this test exercises (the
      # FFI panic-catch layer), so a single execution suffices.
      - uses: actions/setup-python@v5
        if: matrix.substrate.name == 'core'
        with:
          python-version: "3.11"
      - name: install maturin + pytest
        if: matrix.substrate.name == 'core'
        # v1.1.2 (CIRISVerify v2.1.1 hardening): retry pip install
        # against PyPI transient blips. 3 attempts with backoff.
        run: |
          for attempt in 1 2 3; do
            if pip install maturin pytest; then break; fi
            echo "::warning::pip install attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
            [ "$attempt" = "3" ] && { echo "::error::pip install failed 3x"; exit 1; }
          done
      - name: maturin develop (test-panic feature)
        if: matrix.substrate.name == 'core'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          # Same retry pattern inside the venv.
          for attempt in 1 2 3; do
            if pip install maturin pytest; then break; fi
            echo "::warning::pip install (venv) attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
            [ "$attempt" = "3" ] && { echo "::error::pip install failed 3x"; exit 1; }
          done
          maturin develop --features test-panic,pyo3 --release
      - name: pytest tests/python/
        if: matrix.substrate.name == 'core'
        run: |
          source .venv/bin/activate
          pytest tests/python/ -v

  # NOTE: the prior `linux-aarch64-build` cross-compile job was removed
  # in v0.1.15. Its purpose ("prove the crate cross-compiles to arm64
  # from an x86_64 host") is fully subsumed by the native arm64 wheel
  # build on `ubuntu-24.04-arm` (see `pyo3-wheel` matrix), which has
  # been GA + free for public repos since 2025-01. The cross-compile
  # job had become pure churn — it required a fragile apt install of
  # gcc-aarch64-linux-gnu (Azure mirror flakiness) without producing a
  # consumable artifact.


  # Mission alignment: macOS dev path (PLATFORM_ARCHITECTURE.md §1).
  darwin-aarch64-test:
    name: darwin-aarch64 (no postgres)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # v0.7.2 — `cache-bin: false` on macos-14: the runner image
      # ships a rustup stub at `/Users/runner/.cargo/bin/cargo` that
      # falls through to `rustup-init` when the toolchain isn't
      # installed locally. dtolnay's action installs the real cargo
      # over it, but the rust-cache restore was overwriting the
      # freshly-installed cargo with the stub from cached
      # `~/.cargo/bin/`. Disabling bin caching keeps the dtolnay-
      # installed cargo intact. Build cache (registry + target) is
      # unaffected. (v0.7.0/v0.7.1 main CI + v0.7.2 tag CI flakes.)
      # v1.1.2: + continue-on-error per CIRISVerify v2.1.1 hardening.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
        continue-on-error: true
      - name: which cargo (diagnostic)
        run: |
          which cargo
          cargo --version
      - name: cargo test (no postgres feature)
        run: cargo test --features server

  # Mission category §4 + PLATFORM_ARCHITECTURE.md §3.1: iOS device +
  # simulator build path. Runs on macOS with the iOS targets.
  #
  # v2.0.4 — iOS PyO3 cross-compilation. Builds ciris_persist.abi3.so
  # for aarch64-apple-ios (device) and aarch64-apple-ios-sim (simulator).
  # Uses cargo build (not maturin — maturin 1.13's platform check rejects
  # darwin→iOS cross-compile) with PyO3 cross-compilation env vars and
  # BeeWare's Python-Apple-support for the target libpython + _sysconfigdata
  # (PyO3 PR #5605 requires libpython linking on iOS).
  ios-build:
    name: ios PyO3 abi3 (device + simulator)
    runs-on: macos-14
    env:
      PYTHON_IOS_VER: "3.10"
      PYTHON_IOS_BUILD: "b13"
      # Full PyO3 feature set — mirrors pyproject.toml [tool.maturin] features.
      # pyo3 implies postgres (which pulls openssl; vendored via Cargo.toml
      # cfg(target_os = "ios") entry).
      IOS_PYO3_FEATURES: >-
        pyo3 extension-module
        sqlite secrets cirisnode cirisgraph cirisaudit telemetry
        cirisincident classify scrub extract
        cirislens_tasks cirislens_thoughts cirislens_correlations
        cirislens_scheduled_tasks cirislens_tickets
        cirislens_deferral_reports cirislens_maintenance_locks
        cirislens_creation_ceremonies cirislens_continuity_awareness
        cirislens_feedback_mappings cirislens_wa_cert
        cirislens_service_token_revocation cirislens_sequence
        cirislens_occurrence cirislens_legacy_migration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: download Python-Apple-support (iOS)
        id: python-ios
        run: |
          SUPPORT_URL="https://github.com/beeware/Python-Apple-support/releases/download/${PYTHON_IOS_VER}-${PYTHON_IOS_BUILD}/Python-${PYTHON_IOS_VER}-iOS-support.${PYTHON_IOS_BUILD}.tar.gz"
          mkdir -p "${RUNNER_TEMP}/python-ios"
          curl -sL "${SUPPORT_URL}" -o "${RUNNER_TEMP}/python-ios-support.tar.gz"
          tar xzf "${RUNNER_TEMP}/python-ios-support.tar.gz" -C "${RUNNER_TEMP}/python-ios"

          XCFW="${RUNNER_TEMP}/python-ios/Python.xcframework"

          # PyO3 cross-compilation needs libpython + _sysconfigdata in
          # one directory. Stage them from the xcframework.
          DEVICE_DIR="${RUNNER_TEMP}/pyo3-ios-device"
          mkdir -p "$DEVICE_DIR"
          cp "$XCFW/ios-arm64/Python.framework/Python" \
             "$DEVICE_DIR/libpython${PYTHON_IOS_VER}.dylib"
          cp "$XCFW/ios-arm64/lib-arm64/python${PYTHON_IOS_VER}/_sysconfigdata__ios_arm64-iphoneos.py" \
             "$DEVICE_DIR/"
          echo "device_lib_dir=${DEVICE_DIR}" >> "$GITHUB_OUTPUT"

          SIM_DIR="${RUNNER_TEMP}/pyo3-ios-sim"
          mkdir -p "$SIM_DIR"
          cp "$XCFW/ios-arm64_x86_64-simulator/Python.framework/Python" \
             "$SIM_DIR/libpython${PYTHON_IOS_VER}.dylib"
          cp "$XCFW/ios-arm64_x86_64-simulator/lib-arm64/python${PYTHON_IOS_VER}/_sysconfigdata__ios_arm64-iphonesimulator.py" \
             "$SIM_DIR/"
          echo "sim_lib_dir=${SIM_DIR}" >> "$GITHUB_OUTPUT"

          echo "✓ Python-Apple-support ${PYTHON_IOS_VER}-${PYTHON_IOS_BUILD} staged"
          ls -la "$DEVICE_DIR/" "$SIM_DIR/"
      - name: cargo build (ios device — aarch64-apple-ios)
        env:
          PYO3_CROSS: "1"
          PYO3_CROSS_PYTHON_VERSION: "3.10"
          PYO3_CROSS_LIB_DIR: ${{ steps.python-ios.outputs.device_lib_dir }}
        run: >-
          cargo build --release
          --target aarch64-apple-ios
          --features "$IOS_PYO3_FEATURES"
      - name: cargo build (ios simulator — aarch64-apple-ios-sim)
        env:
          PYO3_CROSS: "1"
          PYO3_CROSS_PYTHON_VERSION: "3.10"
          PYO3_CROSS_LIB_DIR: ${{ steps.python-ios.outputs.sim_lib_dir }}
        run: >-
          cargo build --release
          --target aarch64-apple-ios-sim
          --features "$IOS_PYO3_FEATURES"
      - name: strip + package ios artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/ios-device dist/ios-simulator

          # The cdylib output is libciris_persist.dylib; rename to
          # ciris_persist.abi3.so (Python extension naming convention).
          # Fix install name: cargo embeds the CI runner's absolute path;
          # BeeWare Briefcase needs @rpath-relative framework name.
          for pair in \
            "aarch64-apple-ios:ios-device" \
            "aarch64-apple-ios-sim:ios-simulator"; do
            target="${pair%%:*}"
            dir="${pair##*:}"
            SRC="target/${target}/release/libciris_persist.dylib"
            DST="dist/${dir}/ciris_persist.abi3.so"
            if [ -f "$SRC" ]; then
              strip -x "$SRC"
              install_name_tool -id \
                "@rpath/ciris_persist.ciris_persist.framework/ciris_persist.ciris_persist" \
                "$SRC"
              cp "$SRC" "$DST"
              echo "✓ ${dir}: $(ls -la "$DST" | awk '{print $5}') bytes"
              otool -D "$DST"
            else
              echo "::error::${SRC} not found"
              ls -la "target/${target}/release/" | grep ciris
              exit 1
            fi
          done

          echo "=== ios-device ==="
          ls -la dist/ios-device/
          file dist/ios-device/ciris_persist.abi3.so
          echo "=== ios-simulator ==="
          ls -la dist/ios-simulator/
          file dist/ios-simulator/ciris_persist.abi3.so

          tar -czf "dist/ciris-persist-v${VERSION}-ios.tar.gz" \
            -C dist ios-device ios-simulator

          echo "✓ packaged ciris-persist-v${VERSION}-ios.tar.gz"
          ls -la dist/ciris-persist-v${VERSION}-ios.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ciris-persist-ios
          path: dist/ciris-persist-v*-ios.tar.gz

  # v2.0.7 — per-ABI matrix Android builds (#99). Each runner builds
  # both the plain .so and the PyO3 Chaquopy abi3 .so for one ABI.
  # Downstream android-package job collects artifacts into tarballs.
  android-ndk:
    name: android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a,    target: aarch64-linux-android,  clang_prefix: aarch64-linux-android24, pointer_width: 64 }
          - { abi: x86_64,       target: x86_64-linux-android,   clang_prefix: x86_64-linux-android24,  pointer_width: 64, needs_openssl: true }
          - { abi: armeabi-v7a,  target: armv7-linux-androideabi, clang_prefix: armv7a-linux-androideabi24, pointer_width: 32 }
    env:
      MOBILE_FEATURES: >-
        sqlite secrets cirisnode cirisgraph cirisaudit telemetry
        cirisincident classify scrub extract
        cirislens_tasks cirislens_thoughts cirislens_correlations
        cirislens_scheduled_tasks cirislens_tickets
        cirislens_deferral_reports cirislens_maintenance_locks
        cirislens_creation_ceremonies cirislens_continuity_awareness
        cirislens_feedback_mappings cirislens_wa_cert
        cirislens_service_token_revocation cirislens_sequence
        cirislens_occurrence cirislens_legacy_migration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}
        continue-on-error: true
      - name: setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true
      - name: install cargo-ndk
        run: cargo install cargo-ndk
      - name: extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # x86_64 only: OpenSSL 3.6.x SM4-NI workaround
      - name: pre-build OpenSSL for x86_64-android (SM4-NI workaround)
        if: matrix.needs_openssl
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          OPENSSL_VERSION="3.4.1"
          curl -sL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" \
            -o openssl-src.tar.gz
          tar xzf openssl-src.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="${TOOLCHAIN}/bin:${PATH}"
          export CC="x86_64-linux-android24-clang"
          export AR="llvm-ar"
          export RANLIB="llvm-ranlib"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          INSTALL_DIR="${RUNNER_TEMP}/openssl-x86_64-android"
          ./Configure android-x86_64 \
            no-sm4 no-shared no-stdio no-tests \
            -D__ANDROID_API__=24 \
            --prefix="${INSTALL_DIR}" \
            --openssldir="${INSTALL_DIR}/ssl"
          make -j"$(nproc)" build_libs
          make install_dev
          echo "✓ OpenSSL ${OPENSSL_VERSION} built for x86_64-android (no-sm4)"

      - name: export pre-built OpenSSL env vars
        if: matrix.needs_openssl
        run: |
          echo "OPENSSL_NO_VENDOR=1" >> "$GITHUB_ENV"
          echo "X86_64_LINUX_ANDROID_OPENSSL_DIR=${{ runner.temp }}/openssl-x86_64-android" >> "$GITHUB_ENV"
          echo "X86_64_LINUX_ANDROID_OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      # Plain .so (no PyO3) — save before PyO3 build overwrites it
      - name: cargo ndk build (${{ matrix.abi }})
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: >-
          cargo ndk -t ${{ matrix.abi }} build --release
          --features "$MOBILE_FEATURES"
      - name: save plain .so
        run: |
          mkdir -p dist/${{ matrix.abi }}
          cp "target/${{ matrix.target }}/release/libciris_persist.so" \
             "dist/${{ matrix.abi }}/libciris_persist.so"

      # PyO3 Chaquopy abi3 .so — with explicit libpython3.10 DT_NEEDED
      # (#98). Chaquopy loads libpython with RTLD_LOCAL so extensions
      # must DT_NEED it explicitly. We build a stub .so for the linker
      # and add -lpython3.10 via RUSTFLAGS. Chaquopy's real libpython
      # provides the symbols at runtime.
      - name: create PyO3 config + libpython stub
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          CFG="${RUNNER_TEMP}/pyo3-android.config"
          cat > "${CFG}" <<CFGEOF
          implementation=CPython
          version=3.10
          shared=false
          abi3=true
          lib_name=python3.10
          lib_dir=
          executable=
          pointer_width=${{ matrix.pointer_width }}
          build_flags=
          suppress_build_script_link_lines=true
          CFGEOF
          sed -i 's/^[[:space:]]*//' "${CFG}"
          echo "PYO3_CONFIG_FILE=${CFG}" >> "$GITHUB_ENV"

          STUB_DIR="${RUNNER_TEMP}/python-stub"
          mkdir -p "${STUB_DIR}"
          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          echo 'void __pystub(void){}' | \
            "${TOOLCHAIN}/bin/${{ matrix.clang_prefix }}-clang" \
              -shared -nostdlib -Wl,-soname,libpython3.10.so \
              -o "${STUB_DIR}/libpython3.10.so" -x c -
          echo "✓ PyO3 config (pointer_width=${{ matrix.pointer_width }}):"
          cat "${CFG}"
          echo "✓ stub libpython3.10.so:"
          file "${STUB_DIR}/libpython3.10.so"

      - name: cargo ndk build (${{ matrix.abi }} — PyO3 Chaquopy abi3)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUSTFLAGS: "-L ${{ runner.temp }}/python-stub -C link-arg=-Wl,--no-as-needed -C link-arg=-lpython3.10"
        run: >-
          cargo ndk -t ${{ matrix.abi }} build --release --lib
          --features "pyo3 extension-module $MOBILE_FEATURES"

      - name: verify DT_NEEDED includes libpython3.10.so
        run: |
          readelf -d "target/${{ matrix.target }}/release/libciris_persist.so" \
            | grep -q 'libpython3.10.so' \
            && echo "✓ DT_NEEDED: libpython3.10.so present" \
            || { echo "::error::libpython3.10.so missing from DT_NEEDED"; exit 1; }

      - name: strip + collect artifacts
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          # PyO3 .so (for Chaquopy wheels)
          cp "target/${{ matrix.target }}/release/libciris_persist.so" \
             "dist/${{ matrix.abi }}/libciris_persist_pyo3.so"
          if [ -x "$STRIP" ]; then
            "$STRIP" "dist/${{ matrix.abi }}/libciris_persist.so"
            "$STRIP" "dist/${{ matrix.abi }}/libciris_persist_pyo3.so"
          fi
          echo "=== ${{ matrix.abi }} ==="
          ls -la dist/${{ matrix.abi }}/

      - uses: actions/upload-artifact@v4
        with:
          name: ciris-persist-android-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/

  # Downstream job: collect per-ABI artifacts into tarballs + wheels.
  android-package:
    name: package android artifacts
    runs-on: ubuntu-latest
    needs: [android-ndk]
    steps:
      - uses: actions/checkout@v4
      - name: extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ciris-persist-android-*
          path: artifacts/
      - name: package raw android .so tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/android/arm64-v8a dist/android/x86_64 dist/android/armeabi-v7a
          cp artifacts/ciris-persist-android-arm64-v8a/libciris_persist.so    dist/android/arm64-v8a/
          cp artifacts/ciris-persist-android-x86_64/libciris_persist.so       dist/android/x86_64/
          cp artifacts/ciris-persist-android-armeabi-v7a/libciris_persist.so  dist/android/armeabi-v7a/
          tar -czf "dist/ciris-persist-v${VERSION}-android.tar.gz" -C dist android
          echo "✓ ciris-persist-v${VERSION}-android.tar.gz"
      - name: package Chaquopy abi3 wheels
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          build_wheel() {
            local ABI="$1"         # e.g. arm64_v8a (underscore for wheel tag)
            local ABI_DIR="$2"     # e.g. arm64-v8a (hyphen for artifact dir)

            local WHEEL_TAG="cp310-abi3-android_24_${ABI}"
            local WHEEL_NAME="ciris_persist-${VERSION}-${WHEEL_TAG}.whl"
            local WORK="dist/wheel-work/${ABI}"

            mkdir -p "${WORK}/ciris_persist" "${WORK}/ciris_persist-${VERSION}.dist-info"

            cp "artifacts/ciris-persist-android-${ABI_DIR}/libciris_persist_pyo3.so" \
               "${WORK}/ciris_persist/ciris_persist.so"
            cp python/ciris_persist/__init__.py "${WORK}/ciris_persist/"
            cp python/ciris_persist/ciris_persist.pyi "${WORK}/ciris_persist/"

            cat > "${WORK}/ciris_persist-${VERSION}.dist-info/METADATA" <<METAEOF
          Metadata-Version: 2.1
          Name: ciris-persist
          Version: ${VERSION}
          Summary: Unified Rust persistence for the CIRIS federation
          License: AGPL-3.0-or-later
          Requires-Python: >=3.10
          METAEOF

            cat > "${WORK}/ciris_persist-${VERSION}.dist-info/WHEEL" <<WHEELEOF
          Wheel-Version: 1.0
          Generator: ciris-persist-ci
          Root-Is-Purelib: false
          Tag: ${WHEEL_TAG}
          WHEELEOF

            echo "ciris_persist" > "${WORK}/ciris_persist-${VERSION}.dist-info/top_level.txt"

            cd "${WORK}"
            local RECORD="ciris_persist-${VERSION}.dist-info/RECORD"
            : > "${RECORD}"
            find ciris_persist ciris_persist-${VERSION}.dist-info \
              -type f ! -name RECORD | sort | while read -r f; do
              local HASH
              HASH=$(python3 -c "
          import hashlib, base64
          with open('${f}', 'rb') as fh:
              d = hashlib.sha256(fh.read()).digest()
          print('sha256=' + base64.urlsafe_b64encode(d).rstrip(b'=').decode())
          ")
              local SIZE
              SIZE=$(stat -c%s "${f}")
              echo "${f},${HASH},${SIZE}" >> "${RECORD}"
            done
            echo "${RECORD},," >> "${RECORD}"
            cd - > /dev/null

            (cd "${WORK}" && zip -r "../../${WHEEL_NAME}" ciris_persist ciris_persist-${VERSION}.dist-info)
            echo "✓ ${WHEEL_NAME} ($(stat -c%s "dist/${WHEEL_NAME}") bytes)"
          }

          build_wheel arm64_v8a    arm64-v8a
          build_wheel x86_64      x86_64
          build_wheel armeabi_v7a armeabi-v7a

          tar -czf "dist/ciris-persist-v${VERSION}-android-wheels.tar.gz" \
            -C dist \
            "ciris_persist-${VERSION}-cp310-abi3-android_24_arm64_v8a.whl" \
            "ciris_persist-${VERSION}-cp310-abi3-android_24_x86_64.whl" \
            "ciris_persist-${VERSION}-cp310-abi3-android_24_armeabi_v7a.whl"

          echo "✓ ciris-persist-v${VERSION}-android-wheels.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ciris-persist-android
          path: dist/ciris-persist-v*-android.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ciris-persist-android-wheels
          path: dist/ciris-persist-v*-android-wheels.tar.gz

  # Mission category §4 "Mission rejection" + audit/lint.
  lint:
    name: clippy + fmt + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v1.10.0 (CIRISPersist#87) — libtss2 for the `tpm` keyring
      # feature (clippy compiles the full graph).
      - name: install libtss2-dev (TPM build dep)
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # v1.1.2: continue-on-error per CIRISVerify v2.1.1 hardening.
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # v2.0 — clippy over the same widened feature set as the test
      # job, so the substrate backends (cirisaudit, secrets, …) are
      # lint-gated, not just compiled.
      - name: cargo clippy
        run: >-
          cargo clippy --all-targets --features
          "postgres server pyo3 sqlite cirisaudit secrets cirisnode cirisgraph telemetry"
          -- -D warnings

  # Mission category §4 "Mission rejection": the clippy + fmt gate
  # plus a license-deny pass per CRATE_RECOMMENDATIONS §6.
  license-audit:
    name: cargo deny (license + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Build the abi3-py311 wheel via maturin. Per
  # PLATFORM_ARCHITECTURE.md §3.5: one wheel per (os, arch) pair.
  #
  # v0.1.13 — matrix build covering the agent's full PyPI surface:
  #   linux x86_64, linux aarch64, darwin arm64, darwin x86_64.
  # iOS / Android don't ship via PyPI (xcframework / UniFFI native
  # packaging) so they're out of scope here; Phase 1 spec.
  #
  # Each matrix entry runs on a NATIVE runner for that target so we
  # avoid cross-compile drama (sysroot, linkers, vendored openssl
  # quirks). GitHub Actions Linux ARM64 runners
  # (`ubuntu-24.04-arm`) have been GA + free for public repos
  # since 2025-01.
  pyo3-wheel:
    name: maturin abi3-py311 wheel (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: linux-x86_64,   tag: manylinux_2_34_x86_64 }
          - { os: ubuntu-24.04-arm, label: linux-aarch64,  tag: manylinux_2_34_aarch64 }
          - { os: macos-14,         label: darwin-aarch64, tag: macosx_11_0_arm64 }
          # v5.5.4 (CIRISPersist#205) — windows-x86_64 wheel, Win7-capable
          # FROM DAY ONE. persist shipped no Windows wheel before this; #205
          # asks us to bake Win7 in rather than retrofit. Built with the
          # Tier-3 `x86_64-win7-windows-msvc` target (nightly + `-Zbuild-std`)
          # so std keeps the Win7 fallback paths (keyed events,
          # GetSystemTimeAsFileTime, RtlGenRandom) instead of stable ≥1.78's
          # hard-imported Win8/Win10 APIs (WaitOnAddress /
          # GetSystemTimePreciseAsFileTime / ProcessPrng). The artifact runs
          # unchanged on Win10/11. openssl-sys is satisfied by vcpkg static
          # x64-windows-static (the `pyo3`→`postgres`→`dep:openssl` chain),
          # mirroring the proven CIRISEdge#90 setup.
          - { os: windows-latest,   label: windows-x86_64, tag: win_amd64 }
          # darwin-x86_64 (macos-13) intentionally omitted — GitHub
          # Actions Intel macOS runners have ongoing capacity issues
          # (jobs queue indefinitely). CIRISAgent's matrix dropped it
          # for the same reason; their build.yml explicitly notes
          # "macOS Intel: built and uploaded manually (GitHub runner
          # capacity issues)". Persist's
          # FSD/PLATFORM_ARCHITECTURE.md §3.5 already classifies
          # darwin-x86_64 as "sunset target — keep CI green only";
          # publishing a wheel for it is nice-to-have, not load-
          # bearing for the lens cutover. Add back via manual upload
          # if a real consumer materializes.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # v1.10.0 (CIRISPersist#87) — libtss2 for the `tpm` keyring
      # feature on the Linux wheel builds. macOS wheels build the
      # base keyring (no tss-esapi), so this step is Linux-only.
      #
      # v3.5.3 (CIRISPersist#133) — libsqlite3-dev for the dynamic
      # libsqlite3 link. v3.5.2 narrowed the `bundled` rusqlite feature
      # to Android-only, but the Linux wheel-build runner had no
      # libsqlite3-dev installed so `pkg-config --libs sqlite3` failed
      # and the wheel still ended up with libsqlite3 statically embedded.
      # That defeated #132's cross-cdylib SIGSEGV fix at the wheel tier
      # (CIRISEdge#50 still SEGV against the v3.5.2 wheel). The
      # post-build `readelf` gate below catches any future regression.
      - name: install libtss2-dev + libsqlite3-dev (TPM + SQLite build deps)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libsqlite3-dev
      # v5.5.4 (CIRISPersist#205) — Windows openssl-sys link. The `pyo3`
      # feature force-includes `postgres` → `dep:openssl` → openssl-sys;
      # Linux/macOS have a system OpenSSL, Windows does not. vcpkg's
      # static x64-windows-static triplet matches openssl-sys's expected
      # `installed/x64-windows-static/{lib,include}` layout exactly and
      # links statically, so the wheel has zero runtime OpenSSL dep. This
      # is the proven CIRISEdge#90 approach (Strawberry-Perl/openssl-src
      # and Chocolatey both failed there — perl @INC clash / wrong lib
      # layout respectively).
      - name: install OpenSSL via vcpkg (static, x64-windows-static)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-windows-static --x-install-root="$VCPKG_INSTALLATION_ROOT/installed"
          ROOT="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static"
          win_root=$(cygpath -w "$ROOT")
          {
            echo "OPENSSL_DIR=${win_root}"
            echo "OPENSSL_LIB_DIR=${win_root}\\lib"
            echo "OPENSSL_INCLUDE_DIR=${win_root}\\include"
            echo "OPENSSL_STATIC=1"
            echo "OPENSSL_NO_VENDOR=1"
          } >> "$GITHUB_ENV"
          echo "::notice::OPENSSL_DIR=${win_root} (vcpkg static x64-windows-static)"
          ls -la "${ROOT}/lib/libssl.lib" "${ROOT}/lib/libcrypto.lib"
      # Non-Windows: stable. Windows: nightly + rust-src, because the
      # Tier-3 `x86_64-win7-windows-msvc` target ships no precompiled std,
      # so the wheel must `-Zbuild-std` it from source (CIRISPersist#205).
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'
      - uses: dtolnay/rust-toolchain@nightly
        if: runner.os == 'Windows'
        with:
          components: rust-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install maturin
        # v1.1.2 (CIRISVerify v2.1.1 hardening): retry pip install
        # against PyPI transient blips.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pip install maturin; then break; fi
            echo "::warning::pip install attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
            [ "$attempt" = "3" ] && { echo "::error::pip install failed 3x"; exit 1; }
          done
      # v3.6.2 (CIRISPersist#136) — `--auditwheel skip` on Linux so
      # we can invoke `auditwheel repair --exclude libsqlite3.so.0`
      # explicitly in the next step. Maturin's default auto-repair
      # mangles the libsqlite3 SONAME to `libsqlite3-<hash>.so.0` and
      # bundles it into a wheel sidecar, which creates per-wheel
      # libsqlite3 instances that don't unify with the system
      # libsqlite3 loaded by sibling cdylibs (e.g. CIRISEdge#50
      # cohabitation). Two distinct sqlite3 globals + handle tables
      # in one Python process → cross-cdylib SIGSEGV when a handle
      # allocated by one .so is passed to the other.
      #
      # On macOS, `--auditwheel skip` is a no-op (auditwheel doesn't
      # run there).
      - name: maturin build (Linux/macOS)
        if: runner.os != 'Windows'
        run: maturin build --release --strip --auditwheel skip
      # v5.5.4 (CIRISPersist#205) — Windows Win7-capable build. nightly +
      # `-Zbuild-std` (via CARGO_UNSTABLE_BUILD_STD) compiles std from
      # source for the Tier-3 `x86_64-win7-windows-msvc` target, retaining
      # the Win7 fallback paths. RUSTUP_TOOLCHAIN=nightly makes the cargo
      # maturin invokes use nightly; CARGO_BUILD_TARGET routes the build to
      # the win7 triple (maturin tags it win_amd64 — x86_64 + windows). The
      # `confirm wheel shape` gate below asserts the cp310-abi3 tag landed.
      - name: maturin build (Windows — Tier-3 Win7 via build-std)
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: nightly
          CARGO_BUILD_TARGET: x86_64-win7-windows-msvc
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
        run: |
          set -euo pipefail
          if ! rustc --print target-list | grep -qx 'x86_64-win7-windows-msvc'; then
            echo "::error::x86_64-win7-windows-msvc not in nightly target-list — target may have been renamed; check rustc release notes"
            exit 1
          fi
          # LNK1181 workaround: under -Zbuild-std the linker doesn't
          # auto-discover the per-version import library that a transitive
          # `windows-targets` pulls (e.g. `windows.0.48.5.lib`, shipped
          # inside the `windows_x86_64_msvc-0.48.5` crate). Pre-fetch so
          # those crates are extracted, then put every
          # `windows_x86_64_msvc-*/lib` dir on LIB (which link.exe
          # searches) — covers whatever versions the graph resolves.
          cargo fetch
          extra=""
          while IFS= read -r d; do
            extra="${extra};$(cygpath -w "$d")"
          done < <(find "$HOME/.cargo/registry/src" -type d -path '*windows_x86_64_msvc-*/lib' 2>/dev/null | sort -u)
          if [ -n "$extra" ]; then
            export LIB="${LIB:-}${extra}"
            echo "::notice::LIB augmented with windows_x86_64_msvc import-lib dirs:${extra}"
          else
            echo "::warning::no windows_x86_64_msvc import-lib dirs found under cargo registry"
          fi
          maturin build --release --strip --auditwheel skip
      # v3.6.2 (CIRISPersist#136) — explicit auditwheel-repair with
      # libsqlite3 excluded from the bundling pass. This is the same
      # pattern `pyarrow` uses (excludes libssl/libcrypto/libz) and
      # `psycopg2-binary` uses (excludes libssl) for libraries that
      # need to be shared across cdylibs in the same process. The
      # exclude flag leaves `libsqlite3.so.0` as a plain NEEDED entry
      # in the wheel's cdylib, which lets the dynamic loader unify
      # it with whatever other cdylib (e.g. CIRISEdge) loads in the
      # same Python process.
      #
      # Required: production hosts must have `libsqlite3.so.0`
      # installed system-wide. Every manylinux base image includes
      # it; macOS / Windows / Android have their own postures
      # (covered upstream by CIRISVerify v4.4.x target-narrowed
      # bundled feature).
      - name: auditwheel repair (Linux, libsqlite3 excluded)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pip install auditwheel
          mkdir -p target/wheels/repaired
          # `--plat` omitted: auditwheel auto-detects from the wheel's
          # actual versioned symbol references. v3.6.1's maturin-internal
          # auto-repair picked manylinux_2_38 on the same runners; matching
          # that behavior here. Pinning `--plat manylinux_2_34_*` (the
          # matrix.tag value) rejects the wheel because the runner's glibc
          # is newer than 2.34. The matrix.tag field is now informational
          # only (kept for parity with other CI configs).
          for whl in target/wheels/*linux_*.whl; do
            echo "::group::auditwheel repair $whl"
            auditwheel repair \
              --exclude libsqlite3.so.0 \
              --wheel-dir target/wheels/repaired/ \
              "$whl"
            rm "$whl"
            echo "::endgroup::"
          done
          mv target/wheels/repaired/*.whl target/wheels/
          rmdir target/wheels/repaired
      # v3.5.3 (CIRISPersist#133) — wheel-tier libsqlite3 dynamic-link
      # verification. The source-tier #132 fix (Cargo.toml target-
      # narrowed `bundled`) requires libsqlite3-dev present at build
      # time so pkg-config succeeds. If pkg-config fails or any
      # transitive dep re-enables `bundled`, the wheel ends up with
      # libsqlite3 statically embedded and the cross-cdylib SIGSEGV
      # class returns.
      #
      # v3.6.1 (CIRISPersist#133 follow-up) — gate is LINUX-ONLY.
      # The cross-cdylib SIGSEGV (CIRISEdge#50) is a Linux-specific
      # symbol-merging issue. CIRISVerify v4.4.x intentionally bundles
      # libsqlite3 on macOS + Windows + Android.
      #
      # v3.6.2 (CIRISPersist#136) — gate now asserts the PLAIN
      # libsqlite3.so.0 SONAME and rejects the auditwheel-mangled
      # `libsqlite3-<hash>.so.0` + sidecar form. v3.6.1's wheel passed
      # the older gate but still SEGVed in CIRISEdge#50 because
      # auditwheel had mangled the SONAME. This gate now would have
      # caught it.
      - name: verify wheel links libsqlite3 dynamically (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for whl in target/wheels/*.whl; do
            echo "::group::Inspect $whl"
            tmpdir=$(mktemp -d)
            unzip -qq "$whl" -d "$tmpdir"
            so=$(find "$tmpdir" -maxdepth 4 -name '*.abi3.so' | head -1)
            if [ -z "$so" ]; then
              echo "::error::No abi3 cdylib found inside $whl"
              ls -la "$tmpdir"
              exit 1
            fi
            echo "Inspecting cdylib: $so"
            needed_libs=$(readelf -d "$so" | awk '/NEEDED/ {print}')
            echo "NEEDED entries:"
            echo "$needed_libs"
            # v3.6.2 — require PLAIN libsqlite3.so.0 NEEDED entry.
            if ! echo "$needed_libs" | grep -qE 'NEEDED.*\[libsqlite3\.so\.0\]'; then
              echo "::error::$whl missing PLAIN libsqlite3.so.0 NEEDED entry"
              echo "::error::auditwheel --exclude libsqlite3.so.0 didn't take, or rusqlite/bundled re-enabled"
              exit 1
            fi
            # v3.6.2 — reject auditwheel-mangled SONAME (`libsqlite3-<hash>.so.0`).
            # That form creates a per-wheel libsqlite3 instance which
            # defeats cross-cdylib unification (CIRISEdge#50 root cause).
            if echo "$needed_libs" | grep -qE 'libsqlite3-[a-f0-9]+\.so'; then
              echo "::error::$whl has MANGLED libsqlite3 SONAME — auditwheel --exclude not effective"
              echo "::error::Cross-cdylib SIGSEGV (CIRISEdge#50) will recur"
              exit 1
            fi
            # v3.6.2 — reject auditwheel libsqlite3 sidecar.
            sidecar=$(find "$tmpdir" -path '*.libs/*libsqlite3*' 2>/dev/null | head -1)
            if [ -n "$sidecar" ]; then
              echo "::error::$whl carries libsqlite3 in auditwheel sidecar: $sidecar"
              echo "::error::libsqlite3 must come from system, not the wheel — sidecar defeats unification"
              exit 1
            fi
            echo "✓ $whl links libsqlite3.so.0 dynamically (plain SONAME, no sidecar)"
            rm -rf "$tmpdir"
            echo "::endgroup::"
          done
      # v3.6.9 (CIRISPersist#141) — macOS Mach-O parity gate. Mirrors
      # the Linux readelf check above. The bug surfaced when CIRISVerify
      # v4.4.1's target table silently activated rusqlite/bundled on
      # macOS (the v4.4.1 hypothesis was "the cross-cdylib SIGSEGV is
      # Linux-ELF-only" — turned out wrong: Mach-O has the same
      # per-cdylib isolation behavior). CIRISVerify v4.4.3 dropped the
      # macOS bundling; this gate makes any future regression
      # immediately visible instead of latent.
      #
      # Checks via `otool -L` (LC_LOAD_DYLIB) and `nm -gU` (defined
      # global externals) for the abi3 .so inside the macOS wheel:
      #   - REQUIRE: /usr/lib/libsqlite3.dylib appears in LC_LOAD_DYLIB
      #   - REJECT: any defined `sqlite3_*` symbol (statically embedded
      #     libsqlite3 exposes its API as defined globals)
      - name: verify wheel links libsqlite3 dynamically (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for whl in target/wheels/*.whl; do
            echo "::group::Inspect $whl"
            tmpdir=$(mktemp -d)
            unzip -qq "$whl" -d "$tmpdir"
            so=$(find "$tmpdir" -maxdepth 4 -name '*.abi3.so' | head -1)
            if [ -z "$so" ]; then
              echo "::error::No abi3 cdylib found inside $whl"
              ls -la "$tmpdir"
              exit 1
            fi
            echo "Inspecting Mach-O cdylib: $so"
            loads=$(otool -L "$so")
            echo "LC_LOAD_DYLIB entries:"
            echo "$loads"
            if ! echo "$loads" | grep -qE '/usr/lib/libsqlite3\.dylib'; then
              echo "::error::$whl missing /usr/lib/libsqlite3.dylib LC_LOAD_DYLIB entry"
              echo "::error::libsqlite3 appears statically bundled — cross-cdylib SIGSEGV class (CIRISEdge#50) will recur on darwin"
              echo "::error::Check that no transitive dep activates rusqlite/bundled or libsqlite3-sys/bundled"
              exit 1
            fi
            # Reject statically-embedded sqlite3 by looking for defined
            # global sqlite3_* symbols. A dynamically-linked cdylib has
            # sqlite3_* as undefined externals (U) only; a statically-
            # bundled one has them as defined globals (T / D / B).
            if nm -gU "$so" 2>/dev/null | grep -qE ' [TDBSR] _sqlite3_'; then
              defined_count=$(nm -gU "$so" 2>/dev/null | grep -cE ' [TDBSR] _sqlite3_' || true)
              echo "::error::$whl contains $defined_count defined sqlite3_* symbols — libsqlite3 is statically embedded"
              echo "::error::Cross-cdylib SIGSEGV (CIRISEdge#50) will recur on darwin"
              exit 1
            fi
            echo "✓ $whl links /usr/lib/libsqlite3.dylib dynamically (no static sqlite3_* symbols)"
            rm -rf "$tmpdir"
            echo "::endgroup::"
          done
      - name: confirm wheel shape
        # Reject anything that isn't cp310-abi3 — the v0.1.10 regression
        # showed mixed-mode maturin can silently emit cp31N-cp31N
        # wheels which break consumer install on other minors. Catching
        # at build time, before the wheel reaches PyPI.
        # shell: bash so the glob/test syntax runs on Windows too (the
        # runner default is pwsh).
        shell: bash
        run: |
          ls -la target/wheels/
          if ! ls target/wheels/*-cp310-abi3-*.whl >/dev/null 2>&1; then
            echo "::error::Expected cp310-abi3 wheel for ${{ matrix.label }}; got:"
            ls target/wheels/*.whl 2>/dev/null || echo "  (no wheels)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ciris_persist-wheel-${{ matrix.label }}
          path: target/wheels/*.whl

  # v0.1.12 — publish abi3 wheel to PyPI on every tag push.
  #
  # Lens (and any future Python consumer) currently rebuilds persist
  # from source on every cold cache because there's no PyPI artifact
  # — that's ~75min of Rust compile per cold build, dominated by the
  # ciris-keyring + ciris-verify-core + tokio-postgres + ed25519
  # graph. With this job, lens collapses to
  # `pip install ciris-persist==<version>` (~10s).
  #
  # Trust posture: the BuildManifest round-trip
  # (build-manifest job above) is the cryptographic root of trust.
  # PyPI is just a fast distribution channel — peers verifying
  # authenticity check the registry-side hybrid Ed25519 + ML-DSA-65
  # signature on the manifest, not the PyPI artifact itself. PEP 740
  # attestations (enabled below) compound the two: sigstore-attested
  # PyPI upload that ties the wheel to the GitHub Actions identity
  # that produced it.
  #
  # Auth: OIDC trusted publishing. NO API token in CI secrets — PyPI
  # validates the workflow's GitHub identity directly. One-time setup
  # on PyPI side is required (project owner reserves the name +
  # configures the trusted publisher to allow this exact repo +
  # workflow + environment); see docs/PYPI_PUBLISH.md.
  publish-pypi:
    name: Publish wheel to PyPI (tag-gated)
    runs-on: ubuntu-latest
    # v0.3.3 — gate publish on every quality job, not just wheel build.
    # v0.3.2's tag run shipped wheels to PyPI despite a `cargo fmt --check`
    # failure because publish-pypi only required pyo3-wheel + build-manifest.
    # The lint job (clippy + fmt + audit), license-audit, and the
    # full-features integration test (linux-x86_64-test) all need to pass
    # before the wheel reaches PyPI — those are quality gates that
    # presence-of-wheel doesn't otherwise enforce. ios-build + darwin-test
    # are platform-specific build sanity, included for the same reason.
    # v3.6.6 — `build-manifest` re-added as a HARD gate. v2.5.0 made it
    # soft because the hybrid-signing secrets weren't configured; with
    # the secrets now in place + the v3.6.5 PyPI publish surviving a
    # transient registry outage anyway (manifest job failed, soft-fail
    # let publish proceed), the cryptographic-root-of-trust posture is
    # restored. A red manifest job MUST block PyPI publish — otherwise
    # the wheel's BuildManifest round-trip can't be verified by
    # consumers checking `/v1/builds/<v>?project=ciris-persist`.
    needs:
      - pyo3-wheel
      - build-manifest
      - lint
      - license-audit
      - linux-x86_64-test
      - darwin-aarch64-test
      - ios-build
      - android-package
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/ciris-persist/
    permissions:
      # OIDC token-issuance permission. Required for PyPI's trusted
      # publishing. Scope is the workflow's GitHub-issued JWT only;
      # no long-lived secret.
      id-token: write
      # v1.6.0 hardening — `gh run download` (used below to absorb
      # transient ListArtifacts 403s) needs actions:read on the
      # GITHUB_TOKEN.
      actions: read
      contents: read
    steps:
      - name: download all multi-arch wheels (with retry)
        # v1.6.0 — replaces `actions/download-artifact@v4` to absorb
        # transient `403 Forbidden: Error from intermediary` failures
        # from the v4 action's ListArtifacts call (v1.5.24's tag CI
        # hit this exact mode — see commit 0df1665's CI run 26105591714).
        # Same retry shape as the `gh release download` block in the
        # build-manifest job below.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          for attempt in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 'ciris_persist-wheel-*' \
                --dir dist; then
              echo "✓ wheel download succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::wheel download failed 5 times — investigate"
              exit 1
            fi
            echo "::warning::wheel download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          # `gh run download` nests artifacts under per-artifact
          # subdirs (no merge-multiple equivalent). Flatten so the
          # PyPI publish step sees a single dist/*.whl listing.
          find dist -mindepth 2 -name '*.whl' -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
      - name: sanity-check wheel shapes before publish
        # Reject anything that isn't cp310-abi3 — the v0.1.10
        # regression showed mixed-mode maturin can silently emit
        # cp31N-cp31N wheels which break consumer install. Catch
        # at publish time too (also caught at build time per
        # matrix entry).
        run: |
          ls -la dist/
          COUNT=$(ls dist/*.whl 2>/dev/null | wc -l)
          if [ "${COUNT}" -lt 3 ]; then
            echo "::error::Expected 3 wheels (linux x86_64 + aarch64, darwin arm64); got ${COUNT}"
            ls dist/*.whl 2>/dev/null || echo "  (no .whl files at all)"
            exit 1
          fi
          for wheel in dist/*.whl; do
            if ! [[ "${wheel}" =~ -cp310-abi3- ]]; then
              echo "::error::Non-abi3 wheel detected: ${wheel}"
              exit 1
            fi
            echo "✓ ${wheel}"
          done
          echo "✓ All ${COUNT} wheels conform to cp310-abi3."
      - name: publish to PyPI via OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No `password:` — OIDC trusted publishing handles auth.
          packages-dir: dist
          # skip-existing protects against accidental re-publish on
          # tag re-runs. PyPI rejects same-version re-uploads anyway,
          # but failing softly here keeps re-runs idempotent.
          skip-existing: true
          # PEP 740 — sigstore-attested upload. Compounds with the
          # BuildManifest hybrid signature already in place. Free
          # provenance bonus; consumers verifying the manifest can
          # also verify the PyPI artifact ties to this exact GH
          # workflow identity.
          attestations: true

  # Build manifest registration (v0.9.2+, CIRISPersist#42 closed).
  # Signs FOUR per-target BuildManifests covering:
  # - `python-source-tree` (FileTreeExtras over python/ciris_persist/
  #   — what iOS / Android agent rebuilds verify against)
  # - `x86_64-unknown-linux-gnu` (binary manifest over linux x86_64 wheel)
  # - `aarch64-unknown-linux-gnu` (binary manifest over linux aarch64 wheel)
  # - `aarch64-apple-darwin` (binary manifest over macOS arm64 wheel)
  #
  # Then registers them via `ciris-build-sign register` (CanonicalBuild
  # v2 path, CIRISVerify v2.0.3+) so consumer-side
  # `verify_tree(project="ciris-persist", target=...)` can pull the
  # matching per-target manifest from `/v1/builds/<v>?project=...`.
  build-manifest:
    name: Sign + register multi-target build manifests (CanonicalBuild v2)
    runs-on: ubuntu-latest
    needs: pyo3-wheel
    # v3.6.6 — hard-fail restored. The hybrid-signing secrets
    # (CIRIS_BUILD_ED25519_SECRET / CIRIS_BUILD_MLDSA_SECRET) are now
    # configured; a manifest failure means either the secrets rotated
    # without CI being updated OR the registry is unreachable — both
    # block PyPI publish so consumers always have a verifiable
    # BuildManifest round-trip via /v1/builds/<v>?project=ciris-persist.
    # v3.6.5's tag run was the last to ship with the v2.5.0 soft posture
    # (registry was 503'ing during that publish; manifest never
    # registered; PyPI published anyway). Hardening here so that mode
    # can't recur.
    permissions:
      contents: read
      # v1.6.0 hardening — `gh run download` retry block below needs
      # actions:read on the GITHUB_TOKEN.
      actions: read
    steps:
      - uses: actions/checkout@v4
      # v1.10.0 (CIRISPersist#87) — libtss2 for the `tpm` keyring
      # feature; the emit_persist_extras step compiles the crate.
      - name: install libtss2-dev (TPM build dep)
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ciris-persist version: $VERSION"
      - name: install ciris-build-sign v2.1.5 (prebuilt from CIRISVerify release)
        # v1.1.2 — bumped from v2.0.5 to v2.1.5. The v2.1.x series is
        # the CI-hardening arc (continue-on-error on cache, retry on
        # network installs, macOS x86_64 shadow defang via cache-bin:
        # false + bash shell on guards). v2.1.5 also includes everything
        # the v2.0.x line shipped:
        # - CanonicalBuild v2 with per-target rows (v2.0.3)
        # - iOS hardware-marker self-heal (v2.0.4)
        # - Mach-O __TEXT hash sign/runtime parity (v2.0.5)
        # - the `register` subcommand (replaces the prior custom
        #   curl POST to /v1/verify/binary-manifest).
        #
        # Prebuilt tarball is GitHub-hosted, served over TLS against
        # CIRISAI/CIRISVerify. Cosign verification of the release
        # asset is tracked separately (was task #81 under v1.8.0).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          # v1.1.2 (CIRISVerify v2.1.1 CI hardening pattern): retry the
          # `gh release download` to absorb GitHub API transient 5xx /
          # network blip. Three attempts with backoff, then fail loud.
          for attempt in 1 2 3; do
            if gh release download v2.1.5 --repo CIRISAI/CIRISVerify \
                --pattern 'ciris-verify-v2.1.5-build-tool-linux-x86_64.tar.gz'; then
              break
            fi
            echo "::warning::gh release download attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
            if [ "$attempt" = "3" ]; then
              echo "::error::gh release download failed 3 times — investigate"
              exit 1
            fi
          done
          tar -xzf ciris-verify-v2.1.5-build-tool-linux-x86_64.tar.gz
          # Tarball layout: build-tool/{ciris-build-sign,ciris-build-verify}
          sudo install -m755 build-tool/ciris-build-sign /usr/local/bin/ciris-build-sign
          sudo install -m755 build-tool/ciris-build-verify /usr/local/bin/ciris-build-verify
          ciris-build-sign --version
          # Self-contained Rust binary; only deps should be libc +
          # libdl + libpthread.
          ldd "$(command -v ciris-build-sign)" || true
      - name: emit PersistExtras JSON
        # Reads the source tree (migrations/ + cargo tree) and emits
        # the typed extras blob. Deterministic per checkout. Target
        # is set so dep_tree_sha256 reflects the linux-x86_64 build
        # closure — the target this manifest applies to.
        env:
          CIRIS_PERSIST_DEP_TARGET: x86_64-unknown-linux-gnu
        run: |
          mkdir -p dist
          cargo run --release --bin emit_persist_extras \
            > "dist/persist-extras-${{ steps.version.outputs.version }}.json"
          echo "PersistExtras emitted:"
          cat "dist/persist-extras-${{ steps.version.outputs.version }}.json"
      - name: download all multi-arch wheels for per-target manifest signing (with retry)
        # v0.9.2 (CIRISPersist#42) — every wheel target needs its
        # own BuildManifest row in CanonicalBuild v2 so consumer-
        # side `verify_tree(project="ciris-persist", target=...)`
        # can match. Single artifact dir per target.
        #
        # v1.6.0 — replaces `actions/download-artifact@v4` to absorb
        # transient ListArtifacts 403s (see publish-pypi for the
        # underlying GitHub Actions infrastructure flake the v1.5.24
        # tag run surfaced). No flatten step here — the sign script
        # below walks per-target subdirs to map wheel → arch.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/wheels
          for attempt in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 'ciris_persist-wheel-*' \
                --dir dist/wheels; then
              echo "✓ wheel download succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::wheel download failed 5 times — investigate"
              exit 1
            fi
            echo "::warning::wheel download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          ls -la dist/wheels/
      - name: sign multi-target manifests (CanonicalBuild v2)
        # v0.9.2 — replaces the single-target sign of v0.9.1. Four
        # manifests get produced:
        #
        # 1. `python-source-tree` — file-tree hash of `python/ciris_persist/`
        #    (the Python wrappers + .pyi stubs that travel to every
        #    consumer regardless of platform). This is what an agent
        #    running on iOS / Android verifies against — they don't
        #    pip-install (no wheels exist for those platforms); they
        #    embed the Python sources via PyOxidizer / Buildozer /
        #    similar and rebuild persist's Rust from source. The
        #    source-tree hash covers the Python half; the rebuilt
        #    Rust half is covered by the agent's own build chain.
        # 2-4. Three binary manifests (one per published wheel arch):
        #    `x86_64-unknown-linux-gnu`, `aarch64-unknown-linux-gnu`,
        #    `aarch64-apple-darwin`. Each carries `binary_hash =
        #    sha256(wheel.whl)` so a pip-installed deployment can
        #    verify the on-disk wheel against the registered manifest.
        #
        # All four are signed with the SAME hybrid Ed25519 + ML-DSA-65
        # keypair; `ciris-build-sign register` (next step) packs all
        # four into a single `builds` row with per-target
        # `binary_manifests` rows hanging off it.
        env:
          CIRIS_BUILD_ED25519_SECRET: ${{ secrets.CIRIS_BUILD_ED25519_SECRET }}
          CIRIS_BUILD_MLDSA_SECRET: ${{ secrets.CIRIS_BUILD_MLDSA_SECRET }}
        run: |
          if [ -z "${CIRIS_BUILD_ED25519_SECRET}" ] || [ -z "${CIRIS_BUILD_MLDSA_SECRET}" ]; then
            echo "::error::Hybrid signing secrets not configured."
            echo "::error::Set CIRIS_BUILD_ED25519_SECRET and CIRIS_BUILD_MLDSA_SECRET."
            echo "::error::See docs/BUILD_SIGNING.md for ciris-build-sign generate-keys + secret upload."
            exit 1
          fi
          umask 077
          ED_KEY_PATH=$(mktemp)
          MLDSA_KEY_PATH=$(mktemp)
          printf '%s' "${CIRIS_BUILD_ED25519_SECRET}" | base64 -d > "$ED_KEY_PATH"
          printf '%s' "${CIRIS_BUILD_MLDSA_SECRET}" | base64 -d > "$MLDSA_KEY_PATH"

          VERSION="${{ steps.version.outputs.version }}"
          EXTRAS="dist/persist-extras-${VERSION}.json"
          KEY_ID="ciris-persist-build-v1"

          # Target 1: python-source-tree. Walks `python/ciris_persist/`,
          # hashes every .py + .pyi file. Excludes __pycache__,
          # .pyc/.pyo (bytecode), .so/.dylib/.dll (compiled native
          # libs — those are covered by the per-arch binary
          # manifests below, not the source tree). `--tree` mode
          # produces FileTreeExtras automatically, so we don't pass
          # `--extras` (mutually exclusive with `--tree`).
          ciris-build-sign sign \
            --primitive persist \
            --build-id "$VERSION" \
            --target python-source-tree \
            --tree python/ \
            --tree-include ciris_persist \
            --tree-exempt-dir __pycache__ \
            --tree-exempt-ext pyc pyo so dylib dll \
            --binary-version "$VERSION" \
            --ed25519-seed "$ED_KEY_PATH" \
            --mldsa-secret "$MLDSA_KEY_PATH" \
            --key-id "$KEY_ID" \
            --output "dist/manifest-python-source-tree.json"

          # Targets 2-4: per-wheel binary manifests. Loop over the
          # download-artifact subdirs the matrix produced; sign each
          # wheel's sha256 as `target: TRIPLE`. Missing wheels (e.g.
          # one matrix entry failed) get a warning rather than a
          # hard error — the register step below will still ship
          # the targets that DID sign.
          declare -A WHEEL_TARGET=(
            ["ciris_persist-wheel-linux-x86_64"]="x86_64-unknown-linux-gnu"
            ["ciris_persist-wheel-linux-aarch64"]="aarch64-unknown-linux-gnu"
            ["ciris_persist-wheel-darwin-aarch64"]="aarch64-apple-darwin"
            # v5.5.4 (CIRISPersist#205) — Win7-capable wheel signs under the
            # consumer-facing windows triple (the win7 build triple is an
            # implementation detail; consumers match x86_64-pc-windows-msvc).
            ["ciris_persist-wheel-windows-x86_64"]="x86_64-pc-windows-msvc"
          )
          SIGNED_BINARY_TARGETS=()
          for ARTDIR in "${!WHEEL_TARGET[@]}"; do
            TARGET="${WHEEL_TARGET[$ARTDIR]}"
            WHEEL="$(ls dist/wheels/${ARTDIR}/*.whl 2>/dev/null | head -1)"
            if [ -z "${WHEEL}" ]; then
              echo "::warning::No wheel found for ${TARGET} (artifact ${ARTDIR}); skipping"
              continue
            fi
            ciris-build-sign sign \
              --primitive persist \
              --build-id "$VERSION" \
              --target "$TARGET" \
              --binary "$WHEEL" \
              --binary-version "$VERSION" \
              --extras "$EXTRAS" \
              --ed25519-seed "$ED_KEY_PATH" \
              --mldsa-secret "$MLDSA_KEY_PATH" \
              --key-id "$KEY_ID" \
              --output "dist/manifest-${TARGET}.json"
            SIGNED_BINARY_TARGETS+=("${TARGET}")
            echo "✓ signed ${TARGET}: $(basename "${WHEEL}")"
          done
          # Wipe key files immediately after signing.
          shred -uz "$ED_KEY_PATH" "$MLDSA_KEY_PATH" 2>/dev/null || rm -f "$ED_KEY_PATH" "$MLDSA_KEY_PATH"

          echo "Multi-target manifests produced:"
          ls -la dist/manifest-*.json
          # Stash the list for the register step.
          printf '%s\n' "${SIGNED_BINARY_TARGETS[@]}" > dist/signed-binary-targets.txt
      - name: pre-flight registry steward-key check
        # CIRISRegistry exposes GET /v1/steward-key with the active
        # signing key + key_id. We log it for human-visible
        # confirmation that the registry isn't running in ephemeral
        # mode. Per persist issue #2 / registry's own AV-28: an
        # ephemeral-key registry signs every manifest with a key
        # that disappears on registry restart, invalidating
        # downstream verify caches.
        #
        # We don't fail the build on ephemeral mode (registry might
        # be staging / dev intentionally); we surface it loudly so
        # the human running CI sees the posture before downstream
        # peers do.
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          if [ -z "${REGISTRY_URL}" ]; then
            REGISTRY_URL="https://api.registry.ciris-services-1.ai"
            echo "::warning::REGISTRY_URL repo variable unset; defaulting to ${REGISTRY_URL}"
          fi
          echo "Registry steward-key snapshot for ${REGISTRY_URL}:"
          curl -sf "${REGISTRY_URL}/v1/steward-key" | tee dist/steward-key.json | python3 -m json.tool
          # v3.6.6 — registry shipped M-of-N steward shape (per
          # CIRISVerify#31). Old shape was `{classical: {key_id}}`;
          # new shape is `{stewards: [{region, key_id, deployed}, ...],
          # verification_policy: {threshold, of_total, scheme}}`. Surface
          # the first deployed steward's key_id and the policy line.
          python3 <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          d = json.load(open("dist/steward-key.json"))
          deployed = [s for s in d.get("stewards", []) if s.get("deployed")]
          if not deployed:
              print("::error::registry has no deployed stewards", file=sys.stderr)
              sys.exit(1)
          p = d.get("verification_policy", {})
          print(f"registry steward key_id={deployed[0]['key_id']}")
          print(f"registry verification policy={p.get('threshold','?')}-of-{p.get('of_total','?')} {p.get('scheme','')}")
          PYEOF
      - name: register multi-target build with CIRISRegistry
        # v0.9.2 (CIRISPersist#42) — replaces the prior custom
        # curl POST to /v1/verify/binary-manifest with the
        # `ciris-build-sign register` subcommand from CIRISVerify
        # v2.1.5. The subcommand:
        # - Reads each per-target manifest produced above.
        # - Signs a CanonicalBuild v2 `builds` parent row over all
        #   the per-target manifest hashes.
        # - POSTs the `builds` row plus, per target, the
        #   `binary_manifests` (binary mode) or `function_manifests`
        #   (file-tree mode) rows.
        # - Writes to /v1/builds (the new endpoint), making
        #   `GET /v1/builds/<v>?project=ciris-persist` return the
        #   row for downstream `verify_tree(project="ciris-persist")`.
        #
        # The Authorization header is read from the
        # REGISTRY_ADMIN_TOKEN env var directly by the binary.
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_ADMIN_TOKEN: ${{ secrets.REGISTRY_ADMIN_TOKEN }}
          CIRIS_BUILD_ED25519_SECRET: ${{ secrets.CIRIS_BUILD_ED25519_SECRET }}
          CIRIS_BUILD_MLDSA_SECRET: ${{ secrets.CIRIS_BUILD_MLDSA_SECRET }}
        run: |
          if [ -z "${REGISTRY_URL}" ]; then
            REGISTRY_URL="https://api.registry.ciris-services-1.ai"
          fi
          if [ -z "${REGISTRY_ADMIN_TOKEN}" ]; then
            echo "::error::REGISTRY_ADMIN_TOKEN repo secret not configured."
            echo "::error::Ask the bridge / registry team to issue + upload the persist build identity's admin token."
            exit 1
          fi
          if [ -z "${CIRIS_BUILD_ED25519_SECRET}" ] || [ -z "${CIRIS_BUILD_MLDSA_SECRET}" ]; then
            echo "::error::Hybrid signing secrets not configured for register step."
            exit 1
          fi

          # Re-materialize the key files (sign step wiped them).
          # register signs the `builds` row's CanonicalBuild over
          # the aggregated per-target manifest hashes.
          umask 077
          ED_KEY_PATH=$(mktemp)
          MLDSA_KEY_PATH=$(mktemp)
          printf '%s' "${CIRIS_BUILD_ED25519_SECRET}" | base64 -d > "$ED_KEY_PATH"
          printf '%s' "${CIRIS_BUILD_MLDSA_SECRET}" | base64 -d > "$MLDSA_KEY_PATH"

          VERSION="${{ steps.version.outputs.version }}"

          # Build the --target flag list. Source-tree is always
          # present (we just signed it above); binary targets come
          # from the SIGNED_BINARY_TARGETS list the sign step
          # produced.
          TARGET_ARGS=(
            "--target" "python-source-tree:dist/manifest-python-source-tree.json"
          )
          while IFS= read -r TARGET; do
            [ -z "$TARGET" ] && continue
            TARGET_ARGS+=("--target" "${TARGET}:dist/manifest-${TARGET}.json")
          done < dist/signed-binary-targets.txt

          echo "Registering ${#TARGET_ARGS[@]} target args (count includes --target prefix)"
          echo "Targets to register:"
          printf '  %s\n' "${TARGET_ARGS[@]}"

          ciris-build-sign register \
            --registry-url "${REGISTRY_URL}" \
            --project ciris-persist \
            --binary-version "$VERSION" \
            --build-id "${{ github.sha }}" \
            --source-repo "https://github.com/CIRISAI/CIRISPersist" \
            --source-commit "${{ github.sha }}" \
            --notes "CIRIS federation persist substrate; CanonicalBuild v2 multi-target via ciris-build-sign v2.1.5 (CIRISPersist#42). Targets: python-source-tree + per-wheel binary manifests." \
            --ed25519-seed "$ED_KEY_PATH" \
            --mldsa-secret "$MLDSA_KEY_PATH" \
            --key-id ciris-persist-build-v1 \
            "${TARGET_ARGS[@]}"

          # Wipe key files immediately after register.
          shred -uz "$ED_KEY_PATH" "$MLDSA_KEY_PATH" 2>/dev/null || rm -f "$ED_KEY_PATH" "$MLDSA_KEY_PATH"
          echo "✓ Multi-target build registered with CIRISRegistry"
      - name: round-trip verify GET /v1/builds/{version}
        # v0.9.2 — endpoint moved from /v1/verify/binary-manifest
        # to /v1/builds/<v>?project=ciris-persist per CanonicalBuild
        # v2 (CIRISVerify v2.0.3+). Confirms:
        # 1. The `builds` parent row exists.
        # 2. Per-target manifests are queryable via
        #    `?target=<name>`.
        # 3. Each target's manifest_hash matches the local sha256
        #    of the manifest file we signed.
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          if [ -z "${REGISTRY_URL}" ]; then
            REGISTRY_URL="https://api.registry.ciris-services-1.ai"
          fi
          VERSION="${{ steps.version.outputs.version }}"

          # Step 1: parent row exists.
          echo "GET ${REGISTRY_URL}/v1/builds/${VERSION}?project=ciris-persist"
          HTTP_CODE=$(curl -sS -o dist/round-trip-build.json -w "%{http_code}" \
            "${REGISTRY_URL}/v1/builds/${VERSION}?project=ciris-persist")
          echo "HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::GET /v1/builds returned ${HTTP_CODE} — registration didn't land or the public endpoint is rejecting project=ciris-persist"
            cat dist/round-trip-build.json
            exit 1
          fi
          cat dist/round-trip-build.json | python3 -m json.tool

          # Step 2: each per-target manifest is queryable. Build
          # the target list from the manifests we just signed.
          TARGETS=("python-source-tree")
          while IFS= read -r T; do
            [ -z "$T" ] && continue
            TARGETS+=("$T")
          done < dist/signed-binary-targets.txt

          ALL_OK=1
          for TARGET in "${TARGETS[@]}"; do
            echo ""
            echo "GET ${REGISTRY_URL}/v1/builds/${VERSION}?project=ciris-persist&target=${TARGET}"
            HTTP_CODE=$(curl -sS -o "dist/round-trip-${TARGET}.json" -w "%{http_code}" \
              "${REGISTRY_URL}/v1/builds/${VERSION}?project=ciris-persist&target=${TARGET}")
            echo "  HTTP ${HTTP_CODE}"
            if [ "${HTTP_CODE}" != "200" ]; then
              echo "::error::Per-target GET for ${TARGET} returned ${HTTP_CODE}"
              ALL_OK=0
              continue
            fi
            # Local manifest sha256 — should match what the
            # registry stored as `manifest_hash`.
            LOCAL_SHA="$(sha256sum "dist/manifest-${TARGET}.json" | cut -d' ' -f1)"
            echo "  local manifest sha256: ${LOCAL_SHA}"
            echo "  registry response (truncated):"
            python3 -c "
          import json
          d = json.load(open('dist/round-trip-${TARGET}.json'))
          # Surface the manifest_hash if the registry returns it
          # in a known location. Shape may vary by endpoint version;
          # log whatever's there for diagnostic visibility.
          h = d.get('manifest_hash') or d.get('manifest', {}).get('manifest_hash')
          print(f'  registry manifest_hash: {h}')" || true
          done

          if [ "${ALL_OK}" != "1" ]; then
            echo "::error::One or more per-target round-trip GETs failed"
            exit 1
          fi

          {
            echo "## Registry round-trip"
            echo ""
            echo "- registry: \`${REGISTRY_URL}\`"
            echo "- version: \`${VERSION}\`"
            echo "- endpoint: \`GET /v1/builds/<v>?project=ciris-persist\`"
            echo "- targets verified:"
            for T in "${TARGETS[@]}"; do echo "  - \`${T}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ciris-persist-build-manifest-${{ steps.version.outputs.version }}
          path: |
            dist/persist-extras-*.json
            dist/manifest-*.json
            dist/steward-key.json
            dist/round-trip-*.json
            dist/signed-binary-targets.txt

  # v2.0.3 — Mobile release assets on GitHub Releases. Tag-gated.
  # Uploads iOS and Android tar.gz archives so the agent team
  # (CIRISAgent 2.9.0+) can pull pre-built native libraries without
  # building from source. Asset naming follows CIRISVerify's pattern:
  #   ciris-persist-v<version>-ios.tar.gz
  #   ciris-persist-v<version>-android.tar.gz
  #
  # iOS archive layout:
  #   ios-device/libciris_persist.{dylib,a}
  #   ios-simulator/libciris_persist.{dylib,a}
  #
  # Android archive layout:
  #   android/arm64-v8a/libciris_persist.so
  #   android/x86_64/libciris_persist.so
  mobile-release:
    name: Upload mobile artifacts to GitHub Release (tag-gated)
    runs-on: ubuntu-latest
    needs:
      - ios-build
      - android-package
      - lint
      - license-audit
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: download iOS artifact (with retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          for attempt in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name ciris-persist-ios \
                --dir dist; then
              echo "✓ iOS artifact download succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::iOS artifact download failed 5 times"
              exit 1
            fi
            echo "::warning::iOS download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
      - name: download Android artifact (with retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name ciris-persist-android \
                --dir dist; then
              echo "✓ Android artifact download succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Android artifact download failed 5 times"
              exit 1
            fi
            echo "::warning::Android download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
      - name: download Android wheels artifact (with retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name ciris-persist-android-wheels \
                --dir dist; then
              echo "✓ Android wheels download succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Android wheels download failed 5 times"
              exit 1
            fi
            echo "::warning::Android wheels download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
      - name: verify artifacts
        run: |
          echo "=== dist/ ==="
          ls -la dist/
          VERSION="${{ steps.version.outputs.version }}"
          for ASSET in "ciris-persist-v${VERSION}-ios.tar.gz" \
                       "ciris-persist-v${VERSION}-android.tar.gz" \
                       "ciris-persist-v${VERSION}-android-wheels.tar.gz"; do
            if [ ! -f "dist/${ASSET}" ]; then
              echo "::error::Missing expected asset: ${ASSET}"
              exit 1
            fi
            echo "✓ ${ASSET} ($(stat -c%s "dist/${ASSET}" 2>/dev/null || stat -f%z "dist/${ASSET}") bytes)"
          done
      - name: generate SHA256SUMS
        run: |
          cd dist
          sha256sum ciris-persist-v*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: create GitHub Release + upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.version }}"

          # Create release if it doesn't exist yet (PyPI publish may
          # have already created it in a future iteration).
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ciris-persist ${TAG}" \
              --generate-notes \
              --verify-tag
            echo "✓ created release ${TAG}"
          else
            echo "✓ release ${TAG} already exists — uploading assets"
          fi

          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "dist/ciris-persist-v${VERSION}-ios.tar.gz" \
            "dist/ciris-persist-v${VERSION}-android.tar.gz" \
            "dist/ciris-persist-v${VERSION}-android-wheels.tar.gz" \
            "dist/SHA256SUMS"

          echo "✓ uploaded iOS + Android assets to ${TAG}"
          {
            echo "## Mobile release assets"
            echo ""
            echo "- \`ciris-persist-v${VERSION}-ios.tar.gz\`"
            echo "- \`ciris-persist-v${VERSION}-android.tar.gz\`"
            echo "- \`ciris-persist-v${VERSION}-android-wheels.tar.gz\` (Chaquopy abi3 wheels: arm64, x86_64, armeabi-v7a)"
            echo "- \`SHA256SUMS\`"
          } >> "$GITHUB_STEP_SUMMARY"
