name: Bench

# v0.1.7 — performance trend tracking. Mirrors CIRISAgent's
# memory-benchmark.yml trigger shape (weekly cron + manual + path-
# touched PR runs) plus push-to-main so the gh-pages trend chart
# captures every release point.
#
# The five bench harnesses (`benches/{ingest_pipeline,canonicalize,
# sign,dedup_key,queue}.rs`) are criterion-based; criterion writes
# JSON to `target/criterion/` which `benchmark-action/github-action-
# benchmark` consumes for the gh-pages publish.
#
# SECURITY_AUDIT_v0.1.4.md §3.4 cited per-batch latency as a
# v0.2.x track item; this workflow is the regression baseline for
# that work.

on:
  schedule:
    # Monday 7am UTC — one hour after CIRISAgent's memory benchmark
    # so a single coffee surveys both PoB primitives' health.
    - cron: '0 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/ingest.rs'
      - 'src/queue.rs'
      - 'src/store/**'
      - 'src/verify/**'
      - 'src/scrub/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  # benchmark-action needs `contents: write` to push to the
  # gh-pages branch. PR runs use the default ephemeral token which
  # cannot push; the action handles that gracefully (saves results
  # locally, comments PR with regression analysis, no gh-pages
  # publish).
  contents: write
  # PR comment for regression alerts.
  pull-requests: write

# CIRISPersist#297 — same crates.io registry-flake resilience as ci.yml so the
# bench suite's `cargo metadata` doesn't fail fast on a sparse-index / HTTP2
# download hiccup. See ci.yml's env block for the rationale.
env:
  CARGO_NET_RETRY: '10'                 # retry registry/network requests (default 3)
  CARGO_HTTP_MULTIPLEXING: 'false'      # HTTP/1.1 — sidesteps the HTTP/2 framing flake
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'  # git CLI for the 6 CIRISVerify git-dep pins

jobs:
  bench:
    name: Criterion bench suite
    runs-on: ubuntu-latest
    # Eleven benches. The original five are ~60s each; the v1.10.x
    # bench-coverage cut (sequence_contention, engine_cold_start,
    # read_engine_analytics, secrets_crypto, occurrence_registry,
    # storage_floor) adds ~9-11 min — read_engine_analytics dominates
    # (size-swept seeds up to 25k traces). Observed ~14 min locally;
    # headroom for the runner. Bump if we add more benches.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Match clippy.toml's MSRV pin (`msrv = "1.75"`) so the
          # bench artifacts come from the same toolchain we ship
          # against, not whatever stable happens to be on the runner.
          toolchain: stable

      - name: Cache cargo + criterion baseline
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Cargo.lock is gitignored (library convention), so the
          # cache key hashes Cargo.toml — version bumps + new deps
          # invalidate cleanly. The criterion target dir is
          # included so subsequent runs see the previous baseline
          # (criterion writes a per-bench `base` snapshot; the
          # action's regression analysis works without it but is
          # nicer with it).
          key: bench-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            bench-${{ runner.os }}-

      # v10.7.0 (CIRISVerify v8.0.0, #141) — no libtss2-dev: ciris-keyring
      # deleted the link-time tss-esapi backend; nothing to apt-install.

      - name: System info
        run: |
          {
            echo "## System info"
            echo '```'
            echo "Rust:  $(rustc --version)"
            echo "OS:    $(uname -a)"
            echo "RAM:   $(free -h | grep Mem | awk '{print $2}')"
            echo "CPU:   $(nproc) cores ($(lscpu | grep 'Model name' | head -1 | sed 's/Model name:\s*//'))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run criterion benches
        # v1.10.x bench-coverage cut adds the bottom five. SQLite-backed
        # benches (open_in_memory) need no service. `MALLOC_ARENA_MAX`
        # caps glibc's per-thread arenas so the multi-threaded benches'
        # virtual footprint stays sane on the runner.
        #
        # v2.12.0 (CIRISPersist#116) — runs FIRST as the calibration
        # anchor. Pure-compute SplitMix64 microbench produces an
        # `ns/iter` that captures THIS runner's wall-time-per-CPU-op
        # rate. The normalization step further down divides every
        # other bench's value by this calibration, so published
        # metrics are runner-independent.
        #
        # Why this exists: 2.11.0 vs 2.10.0 (a 15-line PyCapsule + a
        # verify pin bump that touches NO benched hot path) tripped
        # 40 performance alerts purely from neighbor-tenant runner
        # load. Absolute ns/iter on shared runners is too noisy for
        # the 1.1× alert threshold; normalization against a pure-CPU
        # calibration anchor solves it.
        env:
          MALLOC_ARENA_MAX: "4"
        run: |
          cargo bench --bench calibration -- --output-format bencher | tee calibration-output.txt
          # v3.3.1 (CIRISPersist#122) — TWO calibration anchors now:
          # `splitmix64_10m` (CPU-bound) + `dram_random_walk_500k`
          # (memory/cache-bound). The normalization step applies
          # whichever anchor matches each bench's bottleneck.
          CAL_CPU_NS=$(grep -E '^test calibration/splitmix64_10m' calibration-output.txt \
            | sed -E 's/.*bench:[[:space:]]+([0-9]+) ns\/iter.*/\1/' \
            | head -1)
          CAL_MEM_NS=$(grep -E '^test calibration/dram_random_walk_500k' calibration-output.txt \
            | sed -E 's/.*bench:[[:space:]]+([0-9]+) ns\/iter.*/\1/' \
            | head -1)
          if [ -z "$CAL_CPU_NS" ] || [ "$CAL_CPU_NS" = "0" ]; then
            echo "::error::failed to extract CPU calibration ns/iter from calibration-output.txt"
            cat calibration-output.txt
            exit 1
          fi
          if [ -z "$CAL_MEM_NS" ] || [ "$CAL_MEM_NS" = "0" ]; then
            echo "::error::failed to extract MEM calibration ns/iter from calibration-output.txt"
            cat calibration-output.txt
            exit 1
          fi
          echo "CALIBRATION_CPU_NS=$CAL_CPU_NS" >> "$GITHUB_ENV"
          echo "CALIBRATION_MEM_NS=$CAL_MEM_NS" >> "$GITHUB_ENV"
          # Back-compat alias — the gh-pages trend chart's pre-#122
          # series was published under env `CALIBRATION_NS` mapped to
          # the CPU anchor. Keep the alias so anything downstream that
          # still reads it stays valid; the new code paths use the
          # explicit `_CPU_NS` / `_MEM_NS` names.
          echo "CALIBRATION_NS=$CAL_CPU_NS" >> "$GITHUB_ENV"
          echo "Runner calibration: CPU=$CAL_CPU_NS ns/iter (splitmix64_10m), MEM=$CAL_MEM_NS ns/iter (dram_random_walk_500k)"
          {
            echo "## Runner calibration"
            echo '```'
            echo "splitmix64_10m:        $CAL_CPU_NS ns/iter  (CPU anchor — applied by default)"
            echo "dram_random_walk_500k: $CAL_MEM_NS ns/iter  (DRAM anchor — applied to memory-bound benches)"
            echo "(higher = slower runner on that axis. Each downstream bench"
            echo " is normalized against whichever axis dominates its bottleneck."
            echo " v3.3.1 #122: read_engine_analytics, dedup_key, and"
            echo " occurrence_registry are memory-bound; everything else CPU-bound.)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Now run the rest into bench-output-raw.txt; the next step
          # normalizes raw→bench-output.txt which benchmark-action
          # consumes.
          cargo bench --features postgres --bench ingest_pipeline -- --output-format bencher | tee bench-output-raw.txt
          cargo bench --bench canonicalize -- --output-format bencher | tee -a bench-output-raw.txt
          cargo bench --bench sign -- --output-format bencher | tee -a bench-output-raw.txt
          cargo bench --bench dedup_key -- --output-format bencher | tee -a bench-output-raw.txt
          cargo bench --features postgres --bench queue -- --output-format bencher | tee -a bench-output-raw.txt
          cargo bench --features sqlite,cirislens_sequence --bench sequence_contention -- --output-format bencher | tee -a bench-output-raw.txt
          cargo bench --features sqlite --bench engine_cold_start -- --output-format bencher | tee -a bench-output-raw.txt
          cargo bench --features sqlite --bench read_engine_analytics -- --output-format bencher | tee -a bench-output-raw.txt
          cargo bench --features secrets --bench secrets_crypto -- --output-format bencher | tee -a bench-output-raw.txt
          cargo bench --features sqlite,cirislens_occurrence --bench occurrence_registry -- --output-format bencher | tee -a bench-output-raw.txt
          cargo bench --features sqlite,cirislens_sequence --bench storage_floor -- --output-format bencher | tee -a bench-output-raw.txt

      # v2.12.0 (CIRISPersist#116) — normalize every ns/iter against
      # the calibration anchor. Output value is scaled so 1
      # calibration tick = 1,000,000 normalized units; keeps numbers
      # readable AND a 2× bench change still shows as a 2× chart
      # change (the scaling is uniform). The calibration line itself
      # is preserved at the top with its raw value so the trend chart
      # tracks runner-noise drift over time as its own series.
      #
      # Geomean cross-check (sanity diagnostic, logs only): if the
      # geomean of all normalized values shifts dramatically run-over-
      # run while the calibration also shifts, normalization is doing
      # its job. If they diverge, a real per-bench regression is
      # buried in there.
      - name: Normalize bench output against calibration anchor
        run: |
          SCALE=1000000
          # Bash-native — small bench output (~50 lines) so loop cost
          # is irrelevant. Avoids YAML-heredoc indentation pitfalls
          # that broke an earlier awk/python attempt.
          # The bench line shape is:
          #   test BENCH_NAME ... bench:        VAL ns/iter (+/- DEV)
          : > bench-output-normalized.txt
          n_normalized=0
          sum_log=0
          # v3.3.1 (CIRISPersist#122) — bench-name → anchor classifier.
          # Memory-bound prefixes get the DRAM walk anchor (those are
          # the families that tripped false-positive alerts on v3.3.0
          # — see CHANGELOG). Everything else uses the CPU anchor.
          while IFS= read -r line; do
            if [[ "$line" =~ ^test\ ([^[:space:]]+)\ \.\.\.\ bench:[[:space:]]+([0-9]+)\ ns/iter[[:space:]]+\(\+/-[[:space:]]+([0-9]+)\) ]]; then
              bench_name="${BASH_REMATCH[1]}"
              val_ns="${BASH_REMATCH[2]}"
              dev_ns="${BASH_REMATCH[3]}"
              # Classifier: explicit list-membership check on bench-
              # name prefix. Update both this list AND the CHANGELOG
              # note when reclassifying a family.
              case "$bench_name" in
                read_engine_analytics/*|dedup_key/*|occurrence_registry/*)
                  anchor_ns="$CALIBRATION_MEM_NS"
                  ;;
                *)
                  anchor_ns="$CALIBRATION_CPU_NS"
                  ;;
              esac
              val_norm=$(( val_ns * SCALE / anchor_ns ))
              dev_norm=$(( dev_ns * SCALE / anchor_ns ))
              prefix="${line%bench:*}bench:"
              printf '%s %d ns/iter (+/- %d)\n' "$prefix" "$val_norm" "$dev_norm" >> bench-output-normalized.txt
              if [ "$val_norm" -gt 0 ]; then
                # Accumulate log for the geomean cross-check (uses bc-arbitrary-precision).
                sum_log=$(echo "scale=8; $sum_log + l($val_norm)" | bc -l)
                n_normalized=$(( n_normalized + 1 ))
              fi
            else
              printf '%s\n' "$line" >> bench-output-normalized.txt
            fi
          done < bench-output-raw.txt
          # Geomean cross-check, diagnostic log only.
          if [ "$n_normalized" -gt 0 ]; then
            geomean=$(echo "scale=2; e($sum_log / $n_normalized)" | bc -l)
            echo "calibration_cpu_ns=$CALIBRATION_CPU_NS  calibration_mem_ns=$CALIBRATION_MEM_NS  n_normalized=$n_normalized  geomean(normalized ns/iter)=$geomean"
          else
            echo "warning: no bench lines normalized; check the bench-output-raw.txt format"
          fi
          # Final output: calibration line (raw) first, then normalized rest.
          cat calibration-output.txt bench-output-normalized.txt > bench-output.txt
          echo "First 20 normalized test lines:"
          grep -E '^test ' bench-output.txt | head -20

      - name: Top-line summary to GH step summary
        run: |
          {
            echo "## Bench top-line"
            echo '```'
            grep -E '^test ' bench-output.txt || cat bench-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to gh-pages trend chart
        # Only on push to main (no PR pushes — the action's perm
        # check handles this but skipping early avoids noise).
        # benchmark-action writes per-bench history to gh-pages
        # branch under dev/bench/; the resulting site at
        # https://cirisai.github.io/CIRISPersist/dev/bench/ shows
        # trend charts per bench function. (The gh-pages root has no
        # index.html — the bare Pages URL 404s by design.)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ciris-persist criterion benchmarks
          tool: 'cargo'
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Threshold for "this commit regressed". 110% means a
          # bench got 10% slower than its previous-best on this
          # branch. Below 110% is the noise floor on a shared
          # runner; above is real and worth investigating.
          alert-threshold: '110%'
          # Don't fail the build on regression — comment-only.
          # We can flip to fail-on-alert: true once the trend
          # chart shows the runner's day-to-day noise floor.
          fail-on-alert: false
          comment-on-alert: true
          # Mention me + repo owners on regression so the comment
          # actually pages someone.
          alert-comment-cc-users: '@CIRISAI/cirispersist-maintainers'

      - name: Save raw criterion JSON as artifact
        # 90-day retention matches CIRISAgent's memory-benchmark
        # workflow. The raw target/criterion/ tree is the
        # ground-truth for any post-hoc analysis past what
        # gh-pages exposes.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: criterion-${{ github.run_id }}
          # v2.12.0 (CIRISPersist#116) — keep raw + calibration
          # alongside the normalized output. The normalized file
          # is what benchmark-action consumes; the raw + calibration
          # are ground truth for post-hoc analysis (e.g. "did the
          # runner shift uniformly or was there a real per-bench
          # regression"). target/criterion/** is criterion's own
          # rich snapshot tree, kept for the same reason.
          path: |
            target/criterion/**
            bench-output.txt
            bench-output-raw.txt
            bench-output-normalized.txt
            calibration-output.txt
          retention-days: 90
