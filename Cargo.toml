# v1.10.0 — keep `target/` from ballooning. The full debuginfo
# (`debug = 2`, the default) is the dominant cost in dev/test builds,
# and this crate's dep graph is large (pyo3 + the CIRISVerify stack +
# rusqlite + timescale). Each distinct `--features` combination cargo
# is asked to build keeps its own artifacts, so debuginfo bloat
# compounds fast across a multi-feature dev/CI session — a full
# `target/debug` had reached 122 GiB once. `line-tables-only` keeps
# panic backtraces with file/line intact (the only debuginfo a
# release-engineering workflow actually needs) while cutting the
# per-build footprint several-fold. The `test` profile inherits this.
[profile.dev]
debug = "line-tables-only"

# v3.12.x (CIRISPersist#156) — full-DWARF profile for the cohabitation
# diagnostic harness (mirrors CIRISEdge's `panic-debug`). Inherits
# release optimization (so the wheel matches what consumers see in
# production) but keeps full debug info so the raw-IP backtrace
# captured by `src/debug/mod.rs` resolves cleanly via
# `addr2line --exe <wheel>/ciris_persist.abi3.so <offset>`. NEVER
# publish a panic-debug wheel: the binary is 4-5× larger than
# release-stripped and ships symbols that release wheels deliberately
# drop. Build invocation in tools/README.md.
#
# The profile alone does NOT enable the `debug-tools` code surface —
# that requires explicitly passing `--features debug-tools` to
# maturin or cargo. The two-layer opt-in (profile + feature) is
# intentional: you can build a panic-debug-profile wheel WITHOUT the
# panic-hook scaffolding (useful for `rust-gdb attach` without the
# in-process instrumentation), and you can build a release-profile
# wheel WITH the panic hook (the hook works without DWARF, just with
# less-useful backtraces).
[profile.panic-debug]
inherits = "release"
debug = "full"
strip = "none"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# v0.5.3 (CIRISPersist#25) — switched panic = "abort" → "unwind".
#
# The original v0.1.x audit argument (SECURITY_AUDIT_v0.1.2.md §4.2)
# was: "panic = 'abort' so a bug in a transitive dep or a future
# unwrap() we missed crashes the process fast (supervisor restarts,
# journal-replay path runs). Unwind into a half-shut state with no
# restart trigger is the failure mode this prevents."
#
# That was correct for the v0.1.x standalone-bin era — a panic
# crashing the persist process triggers a supervisor restart and
# the journal-replay path picks up where it left off.
#
# v0.5.x runs as a PyO3 cdylib loaded into long-lived uvicorn
# workers. In that shape, `panic = "abort"` short-circuits PyO3's
# panic-catching trampoline (pyo3#797) — the panic runtime calls
# abort() before catch_unwind runs. Result: a single bad row /
# bad query SIGABRT'd every uvicorn worker in parallel, taking
# down /health itself (prod wedge 2026-05-11 / CIRISPersist#24).
#
# `panic = "unwind"` lets PyO3 catch the Rust panic and convert it
# to PanicException (Python BaseException subclass). The lens still
# crashes the offending request, but the worker pool survives.
# v0.5.3 (CIRISPersist#27) adds an additional catch_unwind +
# typed LensQueryError(Exception) layer on top so panics become
# normal-Exception 500s, not BaseException worker-poisoners.
#
# Trade-off: ~3-5% larger release binary (unwind tables), no
# realized ROP-via-landing-pads attack surface at the cdylib layer
# (the original concern was for a standalone-bin attack surface).
# See THREAT_MODEL.md §4.2 for the reframed posture.
panic = "unwind"
# SECURITY_AUDIT_v0.1.2.md §4.3 — overflow-checks=true on release
# turns AV-17-class integer-truncation bugs into runtime panics
# instead of silent corruption. Single-digit-percent perf cost;
# defense-in-depth on top of the typed try_into AV-17 fix.
overflow-checks = true
