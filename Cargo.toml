[package]
name = "ciris-persist"
version = "21.8.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Unified Rust persistence for the CIRIS federation — signed events, time-series, runtime state."
repository = "https://github.com/CIRISAI/CIRISPersist"
authors = ["CIRIS AI <hello@ciris.ai>"]
rust-version = "1.83"
publish = false

# Status: Phase 1 in flight (TDD + MDD; see MISSION.md).
# Dep tree is added per-phase as features land. Mission framing per
# component lives in MISSION.md §2; trait shapes sealed Phase 1 per
# PLATFORM_ARCHITECTURE.md §5.

[features]
default = []

# v17.1.0 (CIRISPersist#449, CIRISVerify#202) — compile-time-fenced TEST-ONLY
# genesis relaxation for the local mesh harness (CIRISServer#258). Forwards to
# verify-core's fence so persist and verify share ONE definition of "test
# mode" (`ciris_verify_core::test_anchor::test_anchor_active()`), while
# persist enforces the gate independently at its own genesis-seed chokepoints
# (defense in depth). A prod build (feature off) compiles the relaxation out
# entirely — the genesis path is byte-identical to pre-#449. NEVER enable in
# a published wheel/release lane.
test-anchor = ["ciris-verify-core/test-anchor"]

# Phase 1 features.
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:postgres-types", "dep:refinery", "refinery/tokio-postgres"]
server   = ["dep:axum", "dep:tower", "dep:http-body-util"]
# pyo3 implies postgres — the lens FastAPI integration shape (FSD §3.5)
# needs the Postgres backend to be available. This is the published-wheel
# shape (both backends) — UNCHANGED by #328.
pyo3     = ["_pyffi", "postgres"]
# v11.8.0 (CIRISPersist#328) — postgres-free PyEngine FFI. Same PyO3
# surface as `pyo3` but WITHOUT the Postgres backend, so it does not pull
# `postgres → openssl`. Sqlite-only. Postgres-requiring PyEngine methods
# error cleanly at runtime (a `postgresql://` dsn is rejected; postgres-only
# methods raise a `PyRuntimeError`). Downstream (CIRISEdge) points its
# Windows/mobile wheels here to drop the vcpkg + vendored-openssl builds.
pyo3-sqlite = ["_pyffi"]
# Internal shared feature: the ~13 FFI module-compilation gates fire for
# BOTH public pyo3 shapes via `feature = "_pyffi"`. Not meant to be enabled
# directly (it would give a PyEngine with no backend). Enabling `dep:pyo3`
# lives here so both `pyo3` and `pyo3-sqlite` inherit it.
_pyffi   = ["dep:pyo3"]
# v1.13.0 (CIRISPersist#92) — `extension-module` is its OWN feature,
# enabled by maturin (see `pyproject.toml [tool.maturin] features`),
# NOT folded into `pyo3`.
#
# Why: `pyo3/extension-module` tells PyO3 not to link libpython — correct
# for the `cdylib` wheel (the host interpreter provides the symbols at
# import time), but it also strips libpython from the `cargo test --lib`
# binary, which is a plain executable that has no host interpreter. With
# `extension-module` unconditionally on, any `#[test]` that reaches
# PyO3-C-API drop glue (e.g. constructing an `EngineCell`, which
# transitively owns a `Py<PyAny>` via the change-feed `Subscription`)
# fails to link with `undefined symbol: _Py_DecRef`. Splitting it out
# lets `cargo test --features pyo3` link libpython the normal PyO3 way
# (no RUSTFLAGS), while the wheel build still gets `extension-module`.
extension-module = ["pyo3?/extension-module"]

# v0.1.21 — SQLite backend Phase 1 parity (sovereign-mode + Pi-class
# deployments per FSD §7 #7). Opens `dep:rusqlite` plus the rusqlite
# feature on refinery for embedded migrations. Refinery is also
# imported by the postgres feature; cargo unifies them when both are
# on (refinery built with both `tokio-postgres` and `rusqlite`
# features).
sqlite         = ["dep:rusqlite", "dep:refinery", "refinery/rusqlite"]

# Phase 2 features (declared now; impls land later — MISSION.md §2 / FSD §4).
c-abi          = []
peer-replicate = []

# v0.5.4 (CIRISPersist#29) — test-only PyO3 hook that injects a Rust
# panic at a controlled call site. Used by the Python regression test
# (`tests/python/test_catch_panic.py`) to assert that the FFI
# catch_panic layer converts panics into `LensQueryError` (Exception,
# caught by uvicorn) rather than `PanicException` (BaseException,
# slips past `except Exception`). NOT exposed in release wheels —
# CI's pytest job is the only consumer.
test-panic = []

# v13.3.1 (CIRISPersist#387) — TEST-ONLY seam: exposes
# `Engine::with_signer_no_genesis_seed`, which connects + migrates but
# SKIPS the unconditional HUMANITY_ACCORD holder + family genesis seed.
# Prod builds MUST NOT enable this (a node with no baked trust root is
# broken); default-off so it is absent from release builds. Downstream
# integration tests (e.g. CIRISServer) enable it in `[dev-dependencies]`
# to assemble a controllable custom-holder family without the baked
# A1/B1/C1 + family blocking them. Same test-only pattern as `test-panic`.
test-genesis-seam = []

# v0.6.0 (CIRISPersist#19) — post-ingest filter pipeline features.
# Match FSD §2.4 shape. Lens-side scrub + extract code lift in
# progress; light (regex-only) modules land first, NER/ORT gated
# behind heavy ML deps for production deployments that need them.
#
# - classify:   ContentClass / DetectionMethod / Sensitivity / Action
#               taxonomy + light typed matchers (regex / length /
#               count / freq). No external deps beyond `regex`.
# - scrub:      regex-based scrubber + JSON walker + depth-limited
#               recursion + year-residue check. Depends on classify.
# - extract:    typed Features struct + static walker for the 16-CRC
#               projection inputs. Depends on scrub (shares walker).
# - scrub-ner:  multilingual NER pipeline (Candle / Tokenizers / HF
#               Hub). +500MB build. Only for production lens / edge
#               deployments at full_traces level.
# - scrub-ort:  ORT INT8 backend for NER. Faster inference; same NER
#               coverage as Candle.
classify       = ["dep:regex"]
scrub          = ["classify"]
extract        = ["scrub"]

# v0.6.0-α4 — NER backends. `scrub-ner` activates the Candle XLM-R +
# DistilBERT backends; `scrub-ort` adds the ORT INT8 fast path
# (~3-4× faster on CPU vs Candle). Both backends compile in when
# `scrub-ort` is on; runtime picks via `CIRISLENS_NER_BACKBONE` env.
# The transitive `number_prefix` + `paste` unmaintained advisories
# are ignored in deny.toml (both unmaintained-track only, not
# exploitable).
scrub-ner      = ["scrub", "dep:anyhow", "dep:log", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
scrub-ort      = ["scrub-ner", "dep:ort", "dep:ndarray"]

# Bundle features for common deployment shapes.
default-pipeline-ml     = ["scrub-ner", "extract"]
default-sovereign-light = ["scrub", "extract"]

# v0.6.1 (CIRISPersist#19) — federated SecretsService features per
# FSD POST_INGEST_FILTER_PIPELINE.md §2.4 + §7.
# - secrets:         18-method SecretsService trait + postgres impl +
#                    crypto facade routing through ciris-crypto. Adds
#                    deps on ciris-crypto's aes-gcm + kdf + hmac +
#                    random features so AES-256-GCM + PBKDF2 + HMAC
#                    SHA-256 + OS-RNG are available behind the facade.
#                    Persist takes ZERO direct primitive deps; the
#                    crypto-through-ciris-crypto invariant
#                    (FSD §7.5a) is enforced by `src/secrets/crypto.rs`
#                    being the sole import site of `ciris_crypto::*`.
# - secrets-server:  HTTP API (axum) for federated secrets CRUD per
#                    FSD §8. Requires the `server` feature too.
#
# The hardware-key migration path (FSD §3.1 #18 —
# `migrate_to_hardware_key`) is ACTIVE as of v1.10.0 (CIRISPersist#87).
# It derives the secrets master key via
# `ciris_verify_core::derive_symmetric_key` (CIRISVerify v2.5.0+) over
# a hardware-sealed seed; no separate Cargo feature — the per-platform
# `ciris-keyring` hardware backends are enabled via the `[target.*]`
# tables below (`tpm` on Linux, `ios`/`android` on mobile).
secrets        = [ "classify", "ciris-crypto/aes-gcm", "ciris-crypto/kdf", "ciris-crypto/hmac", "ciris-crypto/random"]
secrets-server = ["secrets", "server"]

# v1.1.0 (CIRISPersist#33 part 4b) — federated HTTP client for the
# secrets API. Optional, additive on top of `secrets`. Only consumers
# that need the federated variant (sovereign Reticulum agents,
# lens-core in-process callers prefer direct backend; this is for the
# HTTP-over-network path) pull this in. reqwest is configured with
# `rustls-tls` (not native-tls) to match the rest of the federation
# transport-layer security posture.
secrets-client = ["secrets", "dep:reqwest", "dep:url"]

# v9.2.0 (CIRISPersist#243 part 3) — `EncryptedKVStore`: an app-layer
# XChaCha20-Poly1305 AEAD key/value store over the bundled rusqlite, for
# the openmls `StorageProvider` cold-state CIRISEdge layers on top
# (CEWP `FSD/SCOPE_PRIVACY.md` §7.8 phone-class degraded posture).
#
# Operator-chosen NOT to use SQLCipher: SQLCipher would change the
# shared `libsqlite3-sys` across all 7 wheel platforms (a cross-platform
# C-build risk). Instead the values + keys are sealed at the application
# layer with the CIRISVerify v6.3.0 scope-privacy crypto (pure-Rust
# `chacha20poly1305` / `hmac` / `hkdf` — NO new C dependency, NO wheel
# risk). It is a sovereign/edge LOCAL-STORE surface (sqlite-backed,
# standalone like a local secret box) — NOT a FederationDirectory
# backend, so there is no pg/sqlite parity obligation.
encrypted-kv = ["sqlite", "ciris-crypto/kdf", "ciris-crypto/hmac", "ciris-crypto/xchacha", "ciris-crypto/random"]

# v0.7.0 (CIRISPersist#19 sibling track; FSD CIRIS_PERSIST.md Appendix A) —
# federation-consensus substrate for CIRISNodeCore. Adds V011 migration
# with the `cirisnode` schema (7 tables) + the typed-write surface
# (put_contribution, cast_vote, etc.) + read primitives (routing
# eligibility, vote weighting, bulk-list).
#
# Distinct track from v0.6.x (lens/agent/bridge substrate). CIRISNodeCore
# v0.1.0 pins ^0.7.0; deployments that don't need the federation-
# consensus surface skip the migration + the feature.
cirisnode      = []

# v0.8.0 (CIRISPersist#34) — graph services absorption track. Powers
# the agent's MemoryService + ConfigService migration off
# `ciris_engine/logic/persistence/` SQLite/Postgres + hand-rolled
# SQL. Backend-agnostic at the trait surface; pair `cirisgraph` with
# either `postgres` (recursive CTEs + GIN on JSONB) or `sqlite`
# (v0.8.4 — recursive CTEs + expression-indexed json_extract) per
# deployment shape. NO embedded graph DB engine — verified via
# deepwiki against CIRISAgent's live query patterns: point lookup
# + time-window scan + bounded k-hop doesn't justify CozoDB / kuzu /
# indradb dep weight.
cirisgraph     = []

# v0.8.1 (CIRISPersist#35) — hash-chained audit log. Absorbs the
# agent's GraphAuditService write path. Per-tenant monotonic
# sequence_number + sha256 prev_hash chain; signature verify uses a
# self-signed model (actor_id IS the Ed25519 pubkey, base64-encoded).
# Threat model AV-49 / AV-50 / AV-51.
cirisaudit     = []

# v0.8.2 (CIRISPersist#36) — telemetry + TSDB consolidation. Absorbs
# the agent's TelemetryService + TSDBConsolidationService surfaces.
# Raw metrics in cirisgraph.telemetry_metrics (24h-lived); summaries
# in cirisgraph.nodes with node_type='tsdb_summary' linked by
# TEMPORAL_NEXT / TEMPORAL_PREV edges. Per-period consolidation lock
# in cirisgraph.consolidation_locks. Depends on cirisgraph for the
# summary-node write path. Threat model AV-52 / AV-53 / AV-54.
telemetry      = ["cirisgraph"]  # no `postgres` or `sqlite` requirement — pairs with either via cirisgraph

# v3.12.x (CIRISPersist#156) — diagnostic harness for cohabitation
# races. Mirrors CIRISEdge's `debug-tools` feature gate shape:
# release wheels ship with this OFF and carry zero diagnostic surface
# (panic-hook code is not compiled in; `CIRIS_PERSIST_PANIC_LOG` is
# never read; `panic_count`/`install_panic_logger` pyfunctions don't
# exist on the module). See `tools/README.md` for the two-layer
# opt-in (feature gate + env var) and security posture.
#
# Build:
#   maturin build --profile panic-debug \
#     --features "pyo3 extension-module debug-tools" \
#     --skip-auditwheel --strip false --include-debuginfo
debug-tools    = ["dep:backtrace"]

# v0.8.3 (CIRISPersist#37) — incident records. Absorbs the agent's
# IncidentManagementService: correlation-keyed deduplication on
# record + open→investigating→resolved→closed state machine.
# Threat model AV-55 / AV-56.
cirisincident  = []

# v1.5.9 (CIRISPersist#59 #1) — agent tasks substrate. First of 11
# substrate absorptions ending CIRISAgent's direct libsqlite access
# to `ciris_engine.db`. Absorbs the `tasks` table — task_id PK
# upsert, status-machine update, multi-occurrence atomic claim via
# ClaimResult, FK-cascade-aware delete. Pairs with either backend
# (PG: JSONB columns + DEFERRABLE self-FK; SQLite: TEXT JSON + plain
# self-FK). Threat model AV-15 (stable kind() tokens).
cirislens_tasks = []

# v1.5.10 (CIRISPersist#59 #2) — agent thoughts substrate. Second of
# 11 substrate absorptions. Absorbs the `thoughts` table —
# thought_id PK upsert, status-machine update, FK to
# cirislens.tasks(task_id), self-FK on parent_thought_id with
# recursive-CTE `get_descendants` for tree walks. PG: JSONB
# columns + DEFERRABLE FKs to handle parent + child in one tx;
# SQLite: TEXT JSON + plain FKs. Threat model AV-15.
cirislens_thoughts = []

# v1.5.11 (CIRISPersist#59 #3) — agent service_correlations substrate.
# Third of 11 substrate absorptions. Dual-purpose schema (service-
# interaction + TSDB metric + distributed-trace span + log)
# discriminated by `correlation_type` — record_correlation with
# ON CONFLICT DO NOTHING for idempotent re-record, focused
# update_correlation_status for state advancement, query_correlations
# for hot-path reads (service / trace / metric / time-window). 18
# columns. No FKs (parent_span_id crosses substrate boundaries). PG:
# JSONB request/response/tags + TIMESTAMPTZ; SQLite: TEXT JSON.
# Threat model AV-15.
cirislens_correlations = []

# v1.5.12 (CIRISPersist#59 #4) — agent scheduled_tasks substrate.
# Fourth of 11 substrate absorptions. Absorbs the scheduler's
# deferred / cron-driven follow-up work table. UPSERT on id,
# `list_due_scheduled_tasks` hot-path for the scheduler tick
# (next_trigger_at <= now AND status IN (PENDING, ACTIVE)),
# `update_after_trigger` for post-fire bookkeeping. 15 columns.
# Status vocabulary is UPPERCASE (`PENDING/ACTIVE/COMPLETE/FAILED`)
# — distinct from tasks/thoughts lowercase. FK to
# `cirislens.thoughts(thought_id)` (PG: DEFERRABLE; SQLite:
# immediate). PG: JSONB deferral_history + TIMESTAMPTZ; SQLite:
# TEXT JSON. Threat model AV-15.
cirislens_scheduled_tasks = []

# v1.5.13 (CIRISPersist#59 #5) — agent tickets substrate. Fifth of
# 11 substrate absorptions. Absorbs the agent's `tickets` table —
# work items routed by SOP, status, and assignee. UPSERT on
# ticket_id (preserves created_at + submitted_at on conflict),
# atomic `assign_ticket` (sets user_identifier + advances status to
# assigned/in_progress), focused `update_ticket_status` (terminal-
# state transitions carry caller-supplied completed_at), cursor-
# paged `list_tickets` with filters for sop/type/status/email/
# automated/deadline_before. 17 columns. Status vocabulary is
# LOWERCASE 8-value (`pending/assigned/in_progress/blocked/
# deferred/completed/cancelled/failed`) — distinct from
# scheduled_tasks UPPERCASE 4-value and partially overlapping with
# `tasks` 6-value. Priority 1-10 (default 5). No FKs.
# agent_occurrence_id default `'__shared__'` (cross-occurrence
# work). PG: JSONB metadata + TIMESTAMPTZ + BOOLEAN automated;
# SQLite: TEXT JSON + INTEGER booleans. Threat model AV-15.
cirislens_tickets = []

# v1.5.14 (CIRISPersist#59 #6) — agent deferral_reports substrate.
# Sixth of 11 substrate absorptions. Absorbs the agent's
# `deferral_reports` table — WA (Wise-Authority) deferrals routed by
# message_id and pointing back into the agent's (task, thought)
# reasoning chain via NOT NULL FKs. UPSERT semantics use
# INSERT...ON CONFLICT(message_id) DO NOTHING → readback (ClaimResult:
# race winner gets Stored, loser gets AlreadyClaimed with existing
# row). `list_active_deferrals` hot path filters `resolved_at IS NULL`
# newest-first; `resolve_deferral` flips the persist-only nullable
# `resolved_at` + `resolution_notes` pair. 7 columns (5 agent +
# 2 persist-only). FKs to cirislens.tasks(task_id) +
# cirislens.thoughts(thought_id) (PG: both DEFERRABLE; SQLite:
# immediate). PG: JSONB package + TIMESTAMPTZ; SQLite: TEXT JSON.
# Threat model AV-15.
cirislens_deferral_reports = []

# v1.5.15 (CIRISPersist#59 #7) — agent maintenance_locks substrate
# (generalized from the agent's consolidation_locks table). Seventh
# of 11 substrate absorptions. Generic lock_key-keyed multi-
# occurrence coordination primitive: TSDB-consolidation workers
# (today) and other future serialized-pass workers (tomorrow) use
# this to ensure one writer at a time per lock_key. Race-safe acquire
# is a single-statement UPSERT with WHERE filtering on
# (not-held OR same-holder OR expired) so the steal-the-stale-lock
# semantics (auto-recover from crashed holders past timeout) happens
# server-side in the same statement that does the acquire — keeps
# the PG NOW() and SQLite julianday('now') clocks symmetric. 5
# columns (4 agent + 1 persist-only metadata JSONB). No FKs.
# Distinct from the existing V015 cirisgraph.consolidation_locks
# (per-period telemetry lock); the two coexist. Threat model AV-15.
cirislens_maintenance_locks = []

# v1.5.16 (CIRISPersist#59 #8) — agent creation_ceremonies substrate.
# Eighth of 11 substrate absorptions. Absorbs the agent's
# `creation_ceremonies` table — identity-creation history (when
# did agent X create agent Y, who was the human witness, which WA
# signed off, what's the ethical justification, etc.). Write-once-
# mostly shape: record_ceremony uses INSERT...ON CONFLICT
# (ceremony_id) DO NOTHING → readback (ClaimResult: race winner
# gets Stored, loser gets AlreadyClaimed with existing row).
# Focused `update_ceremony_status` for the lifecycle transition
# path (pending → in_progress → completed/failed/revoked). 14
# columns matching agent verbatim. No FKs (agent_id references are
# free-form federation-wide pointers). `expected_capabilities`
# stays TEXT (not JSONB) — agent stores it as a JSON-array-shaped
# TEXT and we preserve the wire shape literally. ceremony_status
# CHECK over 5-value vocabulary. Threat model AV-15.
cirislens_creation_ceremonies = []

# v1.5.17 (CIRISPersist#59 #9) — agent continuity_awareness
# substrate. Ninth of 11 substrate absorptions. Absorbs the agent's
# `continuity_awareness` table — per-shutdown record giving the
# next boot a "where did I leave off" surface. 14 columns matching
# agent verbatim. First substrate in the absorption queue with a
# CROSS-SUBSTRATE FK: (preservation_node_id, preservation_scope)
# references the v0.8.0 cirisgraph substrate's nodes table
# (composite PK (node_id, scope)). On PG the FK is DEFERRABLE
# INITIALLY DEFERRED so a shutdown ceremony that writes both the
# graph-node + continuity row in one tx can run with either
# ordering. On SQLite the FK is immediate (PRAGMA foreign_keys=ON
# is set by the store layer). The transitive `cirisgraph` feature
# requirement is load-bearing — the migration won't apply without
# the cirisgraph_nodes table present.
#
# Trait: record_shutdown (INSERT...ON CONFLICT (id) DO NOTHING →
# readback, ClaimResult), get_latest_shutdown (newest non-pruned
# for an agent), record_reactivation (UPDATE
# reactivation_count += 1 on the most-recent non-terminal row).
# PG: JSONB unfinished_tasks/deferred_goals + TIMESTAMPTZ +
# BOOLEAN is_terminal; SQLite: TEXT JSON + INTEGER 0/1.
# preservation_scope CHECK matches cirisgraph's 4-value vocabulary
# (LOCAL/IDENTITY/ENVIRONMENT/COMMUNITY). reactivation_count CHECK
# (>= 0). Threat model AV-15.
cirislens_continuity_awareness = ["cirisgraph"]

# v1.5.18 (CIRISPersist#59 #10) — agent feedback_mappings substrate.
# Tenth of 11 substrate absorptions. Absorbs the agent's
# `feedback_mappings` table — the link between an inbound feedback
# wire-message (typically a Discord message id) and the thought the
# agent resolved against it. 5 columns matching agent verbatim.
# target_thought_id is nullable; FK to cirislens.thoughts(thought_id)
# / cirislens_thoughts(thought_id) fires only for non-NULL values
# (both PG and SQLite handle nullable FKs natively).
#
# Design call: shipped as a dedicated substrate rather than folded
# into cirisgraph_edges. feedback rides on a typed-substrate FK
# (thoughts), NOT a graph_nodes FK; cirisgraph_edges expects
# (source_node_id, target_node_id) both pointing at graph_nodes,
# which doesn't fit the agent's table semantics.
#
# Trait: record_feedback (INSERT...ON CONFLICT (feedback_id) DO
# NOTHING → readback, ClaimResult), list_feedback_for_thought
# (DESC by created_at), list_feedback (filter by source_message_id,
# feedback_type, time window). No JSON columns; created_at on PG is
# TIMESTAMPTZ with NOW() default, on SQLite is TEXT with
# datetime('now', 'subsec') default. Threat model AV-15.
cirislens_feedback_mappings = ["cirislens_thoughts"]

# v1.5.19 (CIRISPersist#59 #11, FINAL) — agent wa_cert substrate.
# ELEVENTH and FINAL substrate absorption ending CIRISAgent's direct
# libsqlite access to `ciris_engine.db`. With this feature on, all 11
# substrates are absorbed and CIRISPersist#59 closes. Absorbs the
# agent's `wa_cert` table — the Wise-Authority cert directory keyed
# on wa_id, with a self-FK on parent_wa_id. 24 columns matching the
# agent verbatim (`_json`-suffixed TEXT columns drop the suffix on
# the persist side; PG promotes them to JSONB; SQLite keeps them as
# TEXT JSON).
#
# Per the "persist is the only library that opens the file"
# guarantee these WA certs live in the engine DB (NOT a separate
# auth.db).
#
# Trait: upsert_wa_cert (idempotent UPSERT on wa_id; preserves
# `created`), get_wa_cert (point lookup), get_by_kid (JWT verify
# hot path via unique jwt_kid), get_by_oauth (OAuth login path via
# partial provider+external_id index), list_by_role (filtered by
# active=TRUE; for list_observers / list_authorities),
# set_active (activity toggle), update_last_login (last-login
# bookkeeping). 7 methods. Self-FK on parent_wa_id is DEFERRABLE
# INITIALLY DEFERRED on PG (one-tx parent+child ceremonies); on
# SQLite the FK is immediate. role CHECK (root/authority/observer)
# + token_type CHECK (standard/session/api_key/oauth/service).
# Threat model AV-15.
cirislens_wa_cert = []

# v1.5.23 (CIRISPersist#64) — service-token revocation substrate.
# Absorbs CIRISAgent's standalone `revoked_service_tokens.db`
# aiosqlite file — the last direct `aiosqlite` consumer in the
# agent. With this feature on, CIRISAgent 2.9.0 Phase 2b can drop
# `aiosqlite` from `requirements.txt`. 4-column table keyed on a
# SHA-based `token_hash` digest (NOT a wa_id; service tokens don't
# map to WA certs — see issue #64 for the two-table distinction).
# All four columns NOT NULL: revocations always carry context
# (when, by whom, why). Trait: record_revocation (idempotent UPSERT
# on token_hash via `ON CONFLICT DO NOTHING` — first record wins),
# list_revocations (full table dump for the agent's boot-time
# cache load; empty Vec on cold tables), check_revocation
# (point-lookup, returns Option). No FKs, no JSONB. Threat model
# AV-15.
cirislens_service_token_revocation = []

# v1.7.1 (CIRISPersist#83) — atomic per-identity monotonic sequence
# primitive for the CIRIS 3.0 in-process cohabitation model. A CIRIS
# runtime holds one Ed25519 identity; every in-process consumer
# (agent, NodeCore, LensCore) and every agent occurrence signs with
# it. Anything emitting ordered signed output (NodeCore
# network-message sequence numbers) needs a counter atomic across
# all of them, else the signed stream forks. One row per
# (identity, stream); next_sequence is a single-statement
# INSERT ... ON CONFLICT DO UPDATE ... RETURNING. Trait:
# next_sequence (atomic bump-and-return, first call → 1),
# peek_sequence (read last-issued without bumping, 0 on cold pair).
# No FKs, no JSONB. Threat model AV-15.
cirislens_sequence = []

# v1.7.3 (CIRISPersist#81) — first-class occurrence registration +
# liveness heartbeat. CIRISAgent previously inferred live occurrences
# by scanning recent task-row activity and dedup'ing
# agent_occurrence_id — an inference, not a registration, with no TTL
# and no clean-shutdown vs crash signal. Under the one-key model
# (PoB §3.2) all occurrences of an agent share one Ed25519 identity,
# so occurrence churn is endpoint liveness under a stable identity.
# One row per live occurrence in cirislens.occurrence_registry;
# expires_at is TTL-based so a crashed occurrence ages out.
# Trait: register_occurrence (idempotent upsert), heartbeat_occurrence
# (bump TTL), deregister_occurrence (clean shutdown removal),
# list_live_occurrences (read-only, expires_at > now). JSONB metadata,
# no FKs. Threat model AV-15.
cirislens_occurrence = []

# v1.6.4 (CIRISPersist#70) — A0a legacy-graph migration absorption.
# LAST raw-SQL gap in CIRISAgent 2.9.0. Absorbs the agent-side
# `tools/ops/migrate_to_persist.py` reader so the agent can drop
# `psycopg2` (PG path) and `sqlite3` (SQLite path) from production
# requirements. The migration reads legacy 2.8.x `graph_nodes` +
# `graph_edges` tables (no audit envelope, lowercase scopes) and
# re-upserts via the existing cirisgraph_upsert_node /
# cirisgraph_upsert_edge surface — `bulk_import=true` skips the
# default AV-45 cap so we can re-check it ourselves against an
# operator-overridable bound. Idempotent (existing rows skipped via
# expected_version / PK semantics). Requires `cirisgraph` for the
# downstream upsert path. Threat model AV-15.
cirislens_legacy_migration = ["cirisgraph"]

# v0.1.3 — optional TLS for the Postgres connection pool. Defaults
# to no-TLS (deployments where the lens process and Postgres are
# on the same host or a private network). Enable when the DB is
# remote — sovereign-mode deployments with Postgres-over-WAN, or
# any deployment where TLS at the lens-API edge doesn't also
# cover the lens→DB hop. THREAT_MODEL.md AV-18.
tls = ["dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-native-certs"]

# Always-on (no_std-cleanness for schema/verify is enforced separately
# by `cargo build --no-default-features --features no_std` per
# PLATFORM_ARCHITECTURE.md §3.4 — Phase 3 stretch).

[dependencies]
# v0.1.9 — bumped from v1.6.4 to v1.8.0. v1.7 brought
# `HardwareSigner::storage_descriptor()` (closes the prediction
# shim in src/ffi/pyo3.rs); v1.8 brought the generic BuildManifest
# validator + ExtrasValidator trait + ciris-build-sign CLI (replaces
# tools/ciris_manifest.py and adds hybrid Ed25519 + ML-DSA-65 manifest
# signing).
# v0.2.3 — bumped to v1.8.5: FIPS 204 final ML-DSA-65 signature size
# fix (3293 → 3309 bytes; CIRISVerify#4 / CIRISPersist#8).
# v0.4.5 (CIRISPersist#20) — bumped v1.9.0 → v1.13.2 (jumping past
# the issue's v1.10.1 target — verify shipped 4 minor versions in
# the interim and v1.10.0..v1.13.2 is all CLI / RegistryClient /
# `verify_tree` work, none of which touches the API surface persist
# consumes today). Pure dep-only bump:
#   - v1.10.0+: ciris-build-sign register subcommand (CLI; not used by persist)
#   - v1.11.0+: RegistryClient per-call project (CLI/library helper; not used)
#   - v1.13.0+: ciris_verify_core::tree_verify::{verify_tree,
#     TreeVerifyRequest, TreeVerifyResult, FailedFile, FailedFileKind}
#     for runtime tree verification. Surface is available to consumers
#     via the workspace-coherent dep, but persist itself doesn't call it
#     (that's a CIRISAgent attestation concern — see
#     `ciris_engine/logic/services/.../attestation/tree_verify.py`).
#
# Readiness for v2.0 (CIRISVerify#7): when verify ships v2.0 with the
# `aes-gcm` / `kdf` / `hmac` / `random` features added to
# `ciris-crypto`, persist's Cargo.toml flips this single tag from
# `v1.13.2` → `v2.0.0` (or whatever) and the `secrets-*` cargo
# features documented in FSD §2.4 light up. The crypto-through-
# ciris-crypto invariant (FSD §7.5a) means persist takes ZERO direct
# deps on AES-GCM/PBKDF2/HKDF/HMAC primitive crates ever — the
# `src/secrets/crypto.rs` facade lands as a single import-site change.
ciris-keyring     = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", features = ["pqc-ml-dsa"] }
ciris-verify-core = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10" }
# v0.3.6 (CIRISPersist#14) — direct ciris-crypto dep for HybridVerifier
# in `Engine.verify_hybrid`. Same git source / tag as ciris-keyring +
# ciris-verify-core so versions are workspace-coherent. Features
# `ed25519` + `pqc-ml-dsa` light up the concrete Ed25519Verifier +
# MlDsa65Verifier impls used by HybridVerifier::verify.
ciris-crypto      = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", features = ["ed25519", "pqc-ml-dsa", "hybrid-kex", "key-grant"] }
async-trait   = "0.1"
# v0.1.14 — filesystem advisory locks for the cohabitation
# bootstrap (docs/COHABITATION.md). POSIX flock cross-process,
# auto-releases on FD close (including panic). Used to serialize
# `get_platform_signer()` calls when multiple workers/processes
# coexist on one host. fs4 is the maintained fork of fs2; pinned
# to 0.x because the API is stable but pre-1.0.
fs4           = "0.13"
libc          = "0.2"
# v3.12.x (CIRISPersist#156) — opt-in raw-IP unwinder for the
# `debug-tools` diagnostic panic hook. Captures backtraces WITHOUT
# invoking the symbol resolver at panic time (the resolver aborts
# under concurrent cohabitation panics — see src/debug/mod.rs for the
# rationale). Symbols resolve post-mortem via
# `addr2line --exe <wheel>/ciris_persist.abi3.so <offset>` on the
# panic-debug profile build. `optional = true` so release wheels do
# not link the crate.
backtrace     = { version = "0.3", optional = true }
serde         = { version = "1", features = ["derive"] }
# v0.1.20 — `arbitrary_precision` preserves the agent's wire number
# tokens verbatim through deserialize → serialize. Closes
# CIRISPersist#7 by NOT re-formatting floats: the agent emitted
# `0.0031992000000000006` (CPython `Py_dg_dtoa`'s pick); v0.1.19
# tried to reproduce that by routing f64 through lexical-core and
# missed because lexical-core (and ryu, and most "shortest round-
# trip" libraries) emit `0.003199200000000001` for that double — the
# original token is not recoverable from a Rust f64. arbitrary_
# precision stores Number as the original parsed string, so re-
# emission is byte-equal to the wire input. Trade-off: feature
# unifies across the dep tree (any crate touching serde_json sees
# string-backed Number internally). Externally observable behavior
# is unchanged for code using stable APIs (Number::as_f64 etc.).
serde_json    = { version = "1", features = ["arbitrary_precision", "raw_value"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
sha2          = "0.10"
# v1.10.1 (CIRISPersist#87 review H2) — scrub master-key material on
# drop. The process-global software-key cache and the hardware seed
# are wrapped in `Zeroizing` so freed key bytes don't linger in the
# heap (swap / core-dump exposure).
zeroize       = "1"
chrono        = { version = "0.4", features = ["serde"] }
thiserror     = "2"
tracing       = "0.1"
base64        = "0.22"
hex           = "0.4"
# v4.10.0 (CIRISPersist#154, CEG 0.8 §0.8) — pure-Rust H3 geospatial
# index for location_proof cell canonicalization + containment. h3o is
# pure Rust (no libh3 C bindings), so it cross-compiles to the iOS /
# Android / wasm wheel targets the same as the rest of the tree. NOT a
# crypto dep — the §1.4 "never rolls its own crypto" invariant is
# unaffected (H3 is geospatial indexing, not key material).
h3o           = "0.7"
# v0.4.3 (CIRISPersist#18) — UUID type for cirislens_derived
# .detection_events.detection_id. v4 generation lives at the
# caller (lens-core); persist just stores. tokio-postgres's
# with-uuid-1 feature gives us ToSql/FromSql for UUID columns.
uuid          = { version = "1", features = ["serde", "v4", "v5"] }
# v2.5.0 (CIRISPersist#102 Ask 4) — JSON Schema validator for the
# envelope-schema admission hook. Per-axis schemas (FSD-002 §4.9.1)
# are JSON Schema documents; persist validates `scores` attestation
# envelopes against the resolved axis schema at admission time.
# Unconditional dep (not feature-gated): the admission hook is shared
# by every backend, and the resolver trait surface is public — making
# the validator feature-conditional would push `#[cfg]` into every
# call site (and break the default-features build of the federation
# module). `jsonschema` is small (~50 KiB compiled, pure Rust) and
# the trade-off favors a uniform code path. Default features OFF —
# the file-fetch / network-fetch surfaces aren't needed; persist
# hands the validator a pre-loaded `serde_json::Value`.
jsonschema    = { version = "0.46", default-features = false }

# Phase 1 — postgres feature
# v5.5.5 — security floors. Three newly-published rust-postgres
# advisories (all malicious-SERVER DoS: RUSTSEC-2026-0178 short DataRow
# panic, -0179 unbounded SCRAM iterations, -0180 malformed hstore panic)
# are fixed in tokio-postgres 0.7.18 / postgres-types 0.2.14 (which pull
# postgres-protocol >= 0.6.12). Pin the floors so the fix is enforced,
# not merely "latest-resolved". Low relevance to persist (the DB is
# trusted infra), but free to patch — no reason to ship the vulnerable
# decoder paths.
tokio-postgres    = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"], optional = true }
deadpool-postgres = { version = "0.14", optional = true }
postgres-types    = { version = "0.2.14", optional = true }
# CIRISPersist#339 — `default-features = false` drops refinery's default
# `toml` feature (config-file loading, which we never use — migrations are
# compile-time `embed_migrations!`) AND the previously-hardcoded
# `tokio-postgres` backend. Each backend feature now opts into its own
# refinery backend: `sqlite` → `refinery/rusqlite`, `postgres` →
# `refinery/tokio-postgres`. This keeps `tokio-postgres` (and its build
# weight) out of a sqlite-only (`pyo3-sqlite`) tree.
refinery          = { version = "0.9", default-features = false, optional = true }

# v0.1.3 — TLS for tokio-postgres connection pool (THREAT_MODEL.md AV-18).
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls                = { version = "0.23", optional = true }
rustls-native-certs   = { version = "0.8", optional = true }
# v12.3.0 (CIRISPersist#355) — the vendored `openssl` dep was removed. It
# was a DEAD LEAF: gated behind `postgres` but with ZERO code references
# (`cargo tree -i openssl` → only ciris-persist; the pool uses `NoTls`,
# TLS is the separate rustls path). Dropping it (base + the android/ios
# target entries below) kills the OpenSSL-from-C build-dep — the slowest,
# flakiest step in the wheel matrix.

# Phase 1 — server feature
axum  = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
http-body-util = { version = "0.1", optional = true }

# v1.1.0 (CIRISPersist#33 part 4b) — secrets-client feature deps.
# reqwest with `rustls-tls` (NOT native-tls) so the federated client's
# TLS stack matches the rest of the persist transport-layer posture
# (rustls is already in Cargo.lock via tokio-postgres-rustls + verify).
# `json` for serde request/response, `gzip` for response compression.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"], optional = true }
url     = { version = "2.5", optional = true }

# Phase 1 — pyo3 feature
# v1.13.0 (CIRISPersist#92): `extension-module` is NOT enabled here —
# it is a separate top-level crate feature (`extension-module`) that
# maturin turns on for the wheel build. See the `[features]` section.
# This keeps `cargo test --features pyo3` linking libpython normally.
pyo3 = { version = "0.29", features = ["abi3-py310"], optional = true }

# v0.6.0 (CIRISPersist#19) — post-ingest filter pipeline deps.
# Light deps (regex) gate `scrub` + `extract`; heavy ML deps below
# gate `scrub-ner` + `scrub-ort`. The ML deps' transitive
# `number_prefix` + `paste` unmaintained-track advisories are
# ignored in deny.toml per α4. Pinned versions match CIRISLens
# cirislens-core (source-of-truth for the lifted scrub/NER code).
regex                = { version = "1.10", optional = true }
# v0.6.0-α4 — ML loader / inference deps. `anyhow` + `log` are used
# only inside the NER backends (CIRISLensCore convention) so they're
# gated behind `scrub-ner` too.
anyhow               = { version = "1", optional = true }
log                  = { version = "0.4", optional = true }
# parking_lot is used by the NER cache, which compiles unconditionally
# (the cache is dormant when scrub-ner is off — is_configured() guard
# short-circuits before the cache is touched). Small dep, well-maintained.
parking_lot          = "0.12"
candle-core          = { version = "0.10", optional = true }
candle-nn            = { version = "0.10", optional = true }
candle-transformers  = { version = "0.10", optional = true }
tokenizers           = { version = "0.20", default-features = false, features = ["onig"], optional = true }
hf-hub               = { version = "0.4", optional = true }
ort                  = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic"] }
ndarray              = { version = "0.16", optional = true }

# v0.1.21 — sqlite backend (Phase 1 parity).
# v0.1.9 — pinned to 0.31 to match ciris-verify-core's transitive
# rusqlite. Both crates declare `links = "sqlite3"`, so cargo's
# resolver requires a single libsqlite3-sys version across the
# workspace. `chrono` adds DateTime<Utc> ToSql/FromSql impls (TEXT
# round-trip via RFC 3339); `serde_json` adds Value ToSql for the
# payload JSONB-as-TEXT column.
#
# v0.8.4 — `bundled` feature is target-conditional. On non-iOS
# (Linux / macOS desktop / Windows / Android) the `bundled` feature
# builds libsqlite3 from source so manylinux wheels don't need a
# system libsqlite3-dev. On iOS, bundled rusqlite duplicates sqlite3
# symbols with iOS's system libsqlite3 — Apple's `libRPAC.dylib`
# (SQLiteDatabaseTracking) sees two sqlite3 dylibs and asserts
# (CIRISVerify v1.6.4 hit + fixed this same trap). On iOS we link
# against the system one instead. Both Cargo target tables below
# resolve to the same dep entry; cargo unifies on the version pin.
rusqlite = { version = "0.31", features = ["chrono", "serde_json"], optional = true }

# Phase 1 robustness — local journal for outage tolerance (FSD §3.4)
redb = "4"

# Async runtime — phase 1+
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "signal", "time"] }

# v2.13.0 (CIRISPersist#113) — change-feed substrate for
# `Engine::subscribe_detection_events`. `futures-core` is the canonical
# `Stream` trait surface (the workspace already pulls it transitively
# via tokio-postgres; we declare it directly so the public signature
# `impl Stream<Item = ...> + Send` doesn't depend on a transitive). The
# tokio-stream `ReceiverStream` adapter wraps `mpsc::Receiver<Item>`
# into a `Stream<Item>` — the v0.1 polling-subscription channel is an
# mpsc, so this is the right adapter. Both are tiny pure-Rust crates;
# no extra link-time / wheel-size cost worth gating.
futures-core = "0.3"
tokio-stream = "0.1"

# v3.5.2 (CIRISPersist#132) — `bundled` is Android-only.
#
# # The trap (CIRISEdge#50 RCA — cross-cdylib SIGSEGV)
#
# When persist.so (Linux PyPI wheel) and edge.so are both loaded into
# the same Python process as separate cdylibs, EACH gets its own
# statically-linked libsqlite3 (because both build with
# `rusqlite/bundled`). Result: two `sqlite3GlobalConfig` static
# globals, two heap allocators, two mutex tables.
#
# Edge has no direct rusqlite use, but the blanket impl
# `<SqliteBackend as OutboundQueue>` is monomorphized in edge's
# compilation — so edge.so's libsqlite3 ends up operating on a
# `sqlite3*` connection allocated by persist.so's libsqlite3.
# Edge's libsqlite3 was never `sqlite3_initialize`d (it sat
# dormant); the first `mallocWithAlarm` indirects through a NULL
# `xMalloc` slot → SIGSEGV in production. See CIRISPersist#132 for
# the gdb stack + the four other traits (VerifyDirectory,
# RootingDirectory, EdgeDetectionAdmission, BlackholeRules) that
# have the same structural defect.
#
# # The fix — one libsqlite3 instance shared via dlopen
#
# Drop `bundled` on every desktop target (Linux / macOS / Windows)
# AND on iOS. The base `[dependencies]` table has
# `rusqlite = { features = ["chrono", "serde_json"] }` with no
# `bundled` → rusqlite/libsqlite3-sys link against the platform's
# libsqlite3 dynamically. Both persist.so and edge.so resolve
# `libsqlite3.so.0` through the same `dlopen` call → ONE library
# instance, ONE initialization, ONE allocator. Manylinux2_28 wheels
# guarantee libsqlite3.so.0 is present. macOS ships
# /usr/lib/libsqlite3.dylib in every release. Windows: same story.
# iOS already used this pattern (avoiding the libRPAC.dylib double-
# dylib trap CIRISVerify v1.6.4 documented); #132 extends it.
#
# Android keeps `bundled` because the NDK's libsqlite3 isn't
# guaranteed across vendor builds and Android's app-sandbox model
# makes statically-linked libsqlite3 the conventional posture.
#
# # Bug history (closed v0.9.0): v0.8.4 placed this target table
# BEFORE `redb`/`tokio` in Cargo.toml — which silently swept those
# deps into the iOS-excluded scope. iOS device builds compiled
# fine on every other target, but tag CI's iOS job failed with
# "cannot find module or crate `tokio`" — blocking PyPI publish.
# Position now pinned at the END of `[dependencies]`, after every
# platform-independent dep.
# Android rusqlite + keyring + openssl all live in the
# single `[target.'cfg(target_os = "android")'.dependencies]` table
# further down (line ~709). Keeping them coalesced avoids the
# duplicate-key cargo error that bit v3.5.2 mid-prep.

# v1.10.0 (CIRISPersist#87) — per-platform hardware-backed secure
# storage for `secrets::migrate_to_hardware_key`. ciris-keyring's
# hardware storage backends are feature-gated; cargo UNIONS the
# features from `[dependencies]` (`pqc-ml-dsa`) with any matching
# `[target.*]` table, so each build target picks up the right backend
# automatically with no per-target maturin config:
#   - Linux   → base set  (TPM 2.0 via the runtime `dlopen` plugin, which
#                          is a DEFAULT ciris-keyring feature as of verify
#                          v8.0.0 — CIRISVerify #141 deleted the link-time
#                          `tss-esapi` backend. The keyring link-binds NO
#                          libtss2 on any target, so there is no longer a
#                          BUILD dep; hardware TPM needs only the runtime
#                          `libciris_tpm_plugin.so`, dlopen'd if present.)
#   - iOS     → `ios`     (Secure Enclave / Keychain — pulls no extra
#                          crates; `ios` is a cfg-only keyring feature)
#   - Android → `android` (Keystore / StrongBox)
# macOS desktop / Windows keep the base set (software + OS keyring) —
# ciris-keyring exposes no hardware backend for them.
#
# `create_platform_storage` runtime-detects the hardware and falls
# back to software storage where there is none, so the binary still
# runs on a no-TPM host (`migrate_to_hardware_key` then returns
# `HardwareKeyUnavailable` and the caller keeps the software master
# key). Placed AFTER every platform-independent dep — see the v0.9.0
# bug note on the rusqlite target table above.
[target.'cfg(target_os = "linux")'.dependencies]
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", features = ["pqc-ml-dsa"] }

[target.'cfg(target_os = "ios")'.dependencies]
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", features = ["pqc-ml-dsa", "ios"] }
# v12.3.0 (CIRISPersist#355) — vendored openssl removed here too (dead leaf;
# see the base-deps note). No iOS openssl in any configuration now.

[target.'cfg(target_os = "android")'.dependencies]
# v3.5.2 (#132) — rusqlite `bundled` for Android. See comment block
# before the iOS entry (~line 628) for the rationale.
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json"], optional = true }
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", features = ["pqc-ml-dsa", "android"] }
# v12.3.0 (CIRISPersist#355) — vendored openssl removed here too (dead leaf;
# see the base-deps note). No Android openssl in any configuration now,
# retiring the flakiest part of the mobile wheel matrix.

[dev-dependencies]
# v21.4.0 (CIRISPersist#513 / CIRISVerify#219) — the custody-attestation
# MOCK fabrication surface (`MockYubicoCa`), test builds only: mint
# FIPS-shaped mock members whose chains verify ONLY against the mock CA's
# own root (structurally inert against the pinned real Yubico root). Same
# git tag as the [workspace] pins — one graph version, feature-unified in
# test builds, absent from `--edges normal`.
ciris-verify-core = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", features = [
    "test-support",
] }
# Mission category §4: canonicalization parity. Used to validate our
# Python-compatible canonicalizer against the JCS reference. NOT a
# runtime dep (see CRATE_RECOMMENDATIONS §6).
serde_json_canonicalizer = "0.3"
hex-literal = "0.4"
proptest = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
# Postgres integration tests share a single test database; parallel
# test execution races on schema setup. serial_test forces the
# postgres-tagged tests to run one at a time without slowing the
# rest of the suite.
serial_test = "3"
# v0.1.7 — bench harness. criterion writes JSON to target/criterion/
# which github-action-benchmark consumes for the gh-pages trend
# chart. Pinning to 0.5.x; 0.6 changes the JSON shape and would
# break the action.
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
name = "ciris_persist"
path = "src/lib.rs"
# v0.1.10 — explicit crate-type so maturin builds the PyO3 extension
# module (cdylib) as the wheel's Python module, not as a "binary
# project wheel" containing src/bin/* artifacts.
#
# Background: v0.1.9 added `src/bin/emit_persist_extras.rs` as a CI
# helper. With the existing `python-source = "python"` mixed-mode
# layout in pyproject.toml plus the new `[[bin]]` targets, maturin
# 1.13's auto-detection picked the binary target instead of the lib,
# producing cp312-cp312 wheels (no abi3) instead of cp311-abi3
# wheels. Explicit `crate-type = ["cdylib", "rlib"]` makes the
# lib unambiguous: cdylib is the Python module; rlib keeps the
# library importable from src/bin/* and integration tests.
crate-type = ["cdylib", "rlib"]

# v0.1.7 — bench declarations. Each `[[bench]]` entry runs as a
# separate harness binary so failures in one don't mask the rest.
# `harness = false` opts out of the default test harness in favor of
# criterion's. SECURITY_AUDIT_v0.1.4.md §5 cited "p99 ingest latency"
# as a v0.2.x track item; these benches are the regression baseline
# for that work.
[[bench]]
name = "ingest_pipeline"
harness = false
required-features = ["postgres"]

# v2.12.0 (CIRISPersist#116) — calibration anchor for runner-noise
# normalization. Pure-compute, no deps beyond criterion. The bench
# workflow extracts this bench's `ns/iter` first and uses it to
# divide every other bench's value, producing runner-independent
# "calibration units" the trend chart + alert threshold can compare
# meaningfully across shared-runner-load variation. See
# `benches/calibration.rs` and `.github/workflows/bench.yml`.
[[bench]]
name = "calibration"
harness = false

[[bench]]
name = "canonicalize"
harness = false

[[bench]]
name = "sign"
harness = false

[[bench]]
name = "dedup_key"
harness = false

[[bench]]
name = "queue"
harness = false
required-features = ["postgres"]

# v1.10.x bench-coverage cut — benches for the v1.7.x–v1.10.1 surface
# that shipped with zero coverage. SQLite in-memory backed where a DB
# is needed, so they need no service in `bench.yml`.

# Atomic sequence-counter contention sweep (sequence/). The optional
# Postgres path inside the bench is itself gated on the `postgres`
# feature + `CIRIS_PERSIST_TEST_PG_URL`; the SQLite path needs only
# `sqlite`, but `cirislens_sequence` gates the migration that creates
# `cirislens_identity_sequences`.
[[bench]]
name = "sequence_contention"
