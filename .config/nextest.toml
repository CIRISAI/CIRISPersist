# v2.0.1 (CIRISPersist#95 cut) — nextest configuration.
#
# Why this file exists: pre-2.0.1, the CI test job ran `cargo test`
# whose output buffers per-test. When a test hung against the CI PG
# container (the 2.0 widened substrate test suite did, twice — both
# 0626ce9 and 7d1831c sat >1h before manual cancel), the log just
# went silent — no way to tell which test was running. Switching to
# nextest gives us per-test streaming AND a bounded kill on hangs:
#
#   slow-timeout.period = "60s"        — print a "SLOW" line with the
#                                        test name after 60s, and again
#                                        every 60s thereafter.
#   slow-timeout.terminate-after = 6   — after 6 such warnings (= 6
#                                        minutes), SIGKILL the test
#                                        and mark it timed out. A
#                                        legitimate heavy bench-smoke
#                                        completes in ≤2 min on CI;
#                                        6 min is honest headroom.
#
# Combined with the workflow-step `timeout-minutes: 25` in
# `.github/workflows/ci.yml`, a real hang now surfaces in <6 min with
# the test name in the log, and the whole step is bounded at 25 min
# regardless. No more silent hour-long waits.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 6 }
# Keep going after a failure so all failing tests surface in one run,
# not just the first. Mirrors the `--no-fail-fast` we pass on the CLI.
fail-fast = false

# v3.5.1 (CIRISPersist#128) — PG test serialization.
#
# Why: 175+ tests carry `#[serial_test::serial(postgres)]`, but that
# crate only serializes WITHIN a process. Nextest spawns one process
# per test by default, so the serial annotation does nothing across
# the process boundary. Multiple PG tests then race on the single
# shared `CIRIS_PERSIST_TEST_PG_URL` database, producing intermittent
# FK violations / row-conflicts / cleanup races that vary per run.
# Confirmed by a 5-run gauntlet at v3.5.0: each run failed on a
# different test (pg_backfill_mixed_and_idempotent, sweeper_evicts_
# lowest_score_first_pg, maintenance_pg_maintain_umbrella_runs_all,
# pg_lookup_trust_grant_exact_and_wildcard). All passed cleanly with
# `--test-threads=1`.
#
# The right fix is structural: declare a `postgres` test group with
# `max-threads = 1`, bind every PG-touching test to it, let non-PG
# tests keep their parallelism. Honors the user directive
# [feedback_hundred_percent_green] without paying the
# `--test-threads=1` global tax.
#
# Binding is by test-path filter — anything matching the listed module
# paths goes into the group. Mirrors the existing serial_test
# annotation distribution (src/store/postgres.rs, src/secrets/postgres.rs,
# src/cirisnode/postgres.rs, src/sequence/postgres.rs,
# src/continuity_awareness/postgres.rs, src/graph/postgres.rs,
# src/maintenance/postgres.rs, src/federation/{emit,backfill,read}.rs,
# plus pg_*_pg test-name pattern across the substrate modules).
[test-groups.postgres]
max-threads = 1

[[profile.default.overrides]]
# v3.5.2 (CIRISPersist#128) — RCA found `av26_concurrent_boot_advisory_lock`
# in tests/qa_harness.rs does `DROP SCHEMA cirislens CASCADE` to simulate
# cold-start, then races 10 workers on run_migrations. While that's running,
# OTHER PG tests see "relation cirislens.merkle_sth_log does not exist"
# (and analogous failures on every other cirislens table). serial_test's
# `#[serial(postgres)]` annotation only serializes within a process; nextest
# spawns one process per test so the annotation is a no-op across the
# process boundary. The test-group's max-threads=1 IS the cross-process
# serializer — we just need to make sure av26 (and any future qa_harness
# tests with similar destructive schema ops) is in the group.
filter = 'test(/_pg$/) + test(/_postgres$/) + test(/::pg_/) + test(/postgres_tests::/) + test(/::postgres::/) + test(av26_concurrent_boot_advisory_lock)'
test-group = "postgres"

# v22.0.0 (CIRISPersist#543) — THE SUBSTRATE GAUNTLET NEEDS A LONGER LEASH.
#
# `src/federation/substrate_machine.rs` runs stateful proptests over
# {op sequences} × {families} × {backends}. Locally the memory+sqlite
# differential takes ~60-90s and the three-way postgres arm ~80s against a
# local container. CI runners are slower and the pg arm talks to a service
# container, so the default `terminate-after = 6` (six 60s warnings, then
# SIGKILL) is uncomfortably close to a legitimate run — and a SIGKILL here
# reads in the log exactly like the hangs this file exists to catch, so a
# false kill would be actively misleading.
#
# 20 minutes of headroom for these tests only. Everything else keeps the 6
# minute bound: a real hang in the rest of the suite still surfaces fast with
# its name in the log, which is the property that mattered in #95.
#
# Deliberately NOT raising the global timeout — that would trade this cut's
# gauntlet coverage for the hang-detection the whole file was written to get.
[[profile.default.overrides]]
filter = 'test(/substrate_machine/)'
slow-timeout = { period = "60s", terminate-after = 20 }
