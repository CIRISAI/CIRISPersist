# Common toolchain pin across the four Rust-compiling CIRIS repos (server /
# persist / edge / verify) — the rustc version is part of the CIRISCache key,
# so drift between repos = zero cross-repo cache hits (CIRISPersist#285 /
# CIRISServer#99). Matches CIRISServer / CIRISVerify (CIRISVerify#180).
#
# EXACT channel, not `stable` (CIRISPersist#396): GitHub bumped `stable`
# 1.96 → 1.97.0 on 2026-07-07, so a floating `stable` re-keys the cache blob
# to whatever rustc the runner image ships that day → cross-repo MISS. All four
# repos carry the same exact channel and bump in lockstep.
#
# GOTCHA — this channel pin and the `dtolnay/rust-toolchain@<ver>` refs in
# .github/workflows/*.yml MUST bump together. `dtolnay/rust-toolchain@stable`
# installs `stable` and adds the cross-compile target to it, but this channel
# pin makes cargo run 1.97.0 (no target on it) → `error[E0463]: can't find
# crate for core`. So the action refs are pinned to @1.97.0 too.
[toolchain]
channel = "1.97.0"
components = ["rustfmt", "clippy"]
