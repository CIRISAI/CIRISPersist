[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "ciris-persist"
description = "Unified Rust persistence for the CIRIS federation — signed events, time-series, runtime state."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "CIRIS AI", email = "hello@ciris.ai" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Database",
    "Topic :: System :: Logging",
]
# v0.2.4 — verify subsumption (CIRISPersist#4): pip-install-time
# subsumption. `pip install ciris-persist` pulls `ciris-verify`
# transitively, which puts `ciris-build-sign` + `ciris-build-verify`
# on PATH. Lens / agent / bridge get one install command for the
# whole verify+persist stack — no separate `pip install ciris-verify`
# step needed for the build-manifest signing CLIs.
#
# v2.0.2 (post-2.0.1 hotfix) — bumped to v3.0.1 floor for the
# CIRIS 3.0 federation-line consolidation. The Rust-side Cargo.toml
# pin moved to ciris-verify-core/keyring/crypto v3.0.1 in the 2.0
# cut (0626ce96), but THIS line — the Python wheel's
# Requires-Dist for the transitive `ciris-verify` PyPI package —
# stayed at `<3`. 2.0.1 published with that mismatch:
# `Requires-Dist: ciris-verify<3,>=2.1.5` while every persist
# consumer needs `ciris-verify>=3.0.1`, so pip resolved the pair
# as an irreconcilable conflict and refused to install. 2.0.2
# fixes that metadata. The Python `ciris-verify` package on PATH
# is now the v3.x major (build-sign / build-verify CLIs); pin to
# `<4` to follow semver-major.
dependencies = [
    "ciris-verify>=4.4.2,<5",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://ciris.ai"
Repository = "https://github.com/CIRISAI/CIRISPersist"
Issues = "https://github.com/CIRISAI/CIRISPersist/issues"

[tool.maturin]
# v0.9.0 (CIRISPersist#41) — wheel ships the FULL agent-adoption
# feature set so `pip install ciris-persist==0.9.0` works for
# every deployment shape without a source-rebuild step:
#
# - `pyo3`            — Python FFI surface. Transitively pulls in
#                       `postgres` (the FastAPI-integration shape
#                       from FSD §3.5).
# - `sqlite`          — SQLite backend for sovereign-mode / Pi /
#                       iOS deployments. Backend selection happens
#                       at `Engine` construction time per DSN
#                       scheme (`postgres://...` vs `sqlite://...`).
# - `cirisgraph`      — graph nodes/edges substrate (v0.8.0 PG /
#                       v0.8.4 SQLite). Absorbs MemoryService +
#                       ConfigService.
# - `cirisaudit`      — hash-chained audit log (v0.8.1 PG / v0.8.5
#                       SQLite). Absorbs AuditService.
# - `telemetry`       — metric writes + 6h TSDB rollup (v0.8.2 PG /
#                       v0.8.6 SQLite). Absorbs TelemetryService +
#                       TSDBConsolidationService.
# - `cirisincident`   — incident records with correlation-keyed
#                       dedup + state machine (v0.8.3 PG / v0.8.7
#                       SQLite). Absorbs IncidentManagementService.
# - `secrets`         — federated SecretsService (v0.6.1 PG only;
#                       SQLite parity tracked v0.9.1, issue #39).
#                       Shipped in the wheel anyway so Postgres
#                       deployments get the API; SQLite callers
#                       hit a clean NotImplemented at the trait
#                       boundary until #39 lands.
# - `cirisnode`       — CIRISNodeCore federation-consensus substrate
#                       (v0.7.x PG only; SQLite parity tracked
#                       v0.9.2, issue #40). Same shape as secrets:
#                       wheel exposes the API; SQLite deployments
#                       don't consume it in v2.9.0 anyway.
# - `extract` / `classify` / `scrub` — post-ingest pipeline
#                       (v0.6.0+ substrate). Already wired into
#                       `Engine.receive_and_persist` at v0.7.4.
#
# Cost: rusqlite's bundled libsqlite3 + the pipeline ML deps add
# ~3-5 MB to the wheel vs the v0.8.3 postgres-only shape.
# Acceptable given the deployment-ergonomics win: one
# `pip install`, every backend + every module, zero source-build.
features = [
    "pyo3",
    # v1.13.0 (CIRISPersist#92) — `extension-module` is its own crate
    # feature (not folded into `pyo3`) so `cargo test --features pyo3`
    # links libpython normally. The WHEEL still needs it: it tells PyO3
    # not to link libpython (the host interpreter provides the symbols
    # at import). maturin enabling it here preserves the wheel shape.
    "extension-module",
    "sqlite",
    "cirisgraph",
    "cirisaudit",
    "telemetry",
    "cirisincident",
    "cirislens_tasks",
    "cirislens_thoughts",
    "cirislens_correlations",
    "cirislens_scheduled_tasks",
    "cirislens_tickets",
    "cirislens_deferral_reports",
    "cirislens_maintenance_locks",
    "cirislens_creation_ceremonies",
    "cirislens_continuity_awareness",
    "cirislens_feedback_mappings",
    "cirislens_wa_cert",
    "cirislens_service_token_revocation",
    "cirislens_sequence",
    "cirislens_occurrence",
    "cirislens_legacy_migration",
    "secrets",
    "cirisnode",
    "extract",
    "classify",
    "scrub",
]
module-name = "ciris_persist"
# abi3-py310: one wheel covers Python 3.10+ (lowered from 3.11 for
# BeeWare iOS compatibility). PLATFORM_ARCHITECTURE.md §3.5.
python-source = "python"
strip = true

# v0.5.4 (CIRISPersist#29) — pytest discovery scoped to tests/python/.
# CI builds the wheel with `--features test-panic,pyo3`, then runs
# pytest to validate the FFI catch_panic invariant. Release wheels
# skip these tests (the panic injector is gated out by feature flag).
[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
